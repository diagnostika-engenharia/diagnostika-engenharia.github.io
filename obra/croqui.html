<!doctype html>

<head>
<meta charset="utf-8">

<style>
:root{--bg:#f6f7f7;--card:#fff;--tx:#1d2b2f;--mut:#667;--bd:#dde2e3;--teal:#0f6e74;
--s0:#eceae4;--s1:#e8a33d;--s2:#d8c24a;--s3:#8ec1e0;--s4:#2e7fb0;--s5:#2f9e5b;--vid:#fff;--cinza:#b9bdbf}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--teal);color:#fff;padding:12px 16px}
header h1{font-size:16px;margin:0}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.tabs button{flex:none;border:1px solid var(--bd);background:#fff;border-radius:18px;padding:6px 12px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
main{padding:12px 16px 150px;max-width:1200px;margin:0 auto}
.lay{display:grid;gap:14px}
@media(min-width:900px){.lay{grid-template-columns:minmax(0,1fr) 340px}.pal{justify-content:center}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card h3{margin:0 0 8px;font-size:14px}
svg{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none}
.cel{cursor:pointer;stroke:#7b7f80;stroke-width:.25}
.cel:hover{stroke:#000;stroke-width:.6}
.pal{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:8px 12px;display:flex;gap:6px;overflow-x:auto;z-index:6}
.pal button{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--bd);background:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.pal button.on{border-color:var(--tx)}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid #0003;display:inline-block}
.bar{height:8px;background:#e7ebec;border-radius:5px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%}
.lin{display:flex;justify-content:space-between;font-size:13px}
.big{font-size:28px;font-weight:700;color:var(--teal)}
.mut{color:var(--mut);font-size:12px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acoes button,.acoes label{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.geral{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#0D3C44,#155B67);color:#fff;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px;text-align:center}
#gate .bx{background:#fff;color:#1d2b2f;border-radius:16px;padding:24px;max-width:380px}
#gate .bx h2{color:#155B67;font-size:18px;margin:0 0 8px}
#gate a{display:inline-block;background:#155B67;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;margin-top:10px}
header a{color:#fff}
#sync{white-space:nowrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<header><h1><a href="../" title="Painel principal" style="display:inline-flex;vertical-align:middle;margin-right:8px"><img src="../assets/icon.png" alt="Diagnóstika" style="height:26px;width:26px;border-radius:7px;background:#fff;padding:2px"></a>Planta e Fachadas · Ed. Menotti del Picchia</h1>
<p><a href="./">‹ Voltar ao app</a> · <a href="modelo3d.html">Modelo 3D</a> · <span id="sync">carregando…</span></p>
<p>Nas fachadas, escolha a etapa embaixo e toque nos quadros. A grade de pastilhas segue os quadrantes 1 a 9 do laudo.</p></header>

<main id="main"></main>
<div class="pal" id="pal"></div>

<script>
// Etapas acumulativas: quadro na etapa k tem as etapas 1..k concluídas
const ETAPAS=[
 {n:'Não iniciado',c:'var(--s0)'},
 {n:'Remoção',c:'var(--s1)'},
 {n:'Tratamento / regularização',c:'var(--s2)'},
 {n:'Fundo preparador',c:'var(--s3)'},
 {n:'Revestimento final',c:'var(--s4)'},
 {n:'Aprovado (fiscalização)',c:'var(--s5)'}];

// Blocos verticais de cada fachada (larguras proporcionais aos desenhos do laudo)
// t: p=parede, s=sacada (fora da remoção), f=faixa de pastilhas do laudo (3x3 por pavimento), v=vão/janela contínua
const FACH=[
 {id:'rua',n:'Fachada Rua (Frente)',b:[['s',24,'Sacadas'],['p',3.4],['f',26],['p',9]],terreoFaixa:false},
 {id:'piscina',n:'Fachada Piscina',b:[['p',8,'',1],['p',6,'',1],['p',17],['s',17,'Sacadas'],['p',9,'',1],['p',8,'',1],['s',21,'Sacadas'],['f',17],['p',6,'',1],['p',8,'',1]],terreoFaixa:false},
 {id:'oposta',n:'Fachada Oposta à Piscina',b:[['p',13],['p',13,'',1],['p',13,'',1],['v',4],['f',26],['v',4],['p',13,'',1],['p',13,'',1],['p',13]],terreoFaixa:true},
 {id:'churrasqueira',n:'Fachada Churrasqueira (Fundo)',b:[['p',16.5],['f',16.5],['p',5.6],['p',33,'',3],['p',16.5]],terreoFaixa:false}];

// Quadrantes com patologia no laudo (pavimento: quadrantes)
const L=s=>s.split(',').map(Number), T9=L('1,2,3,4,5,6,7,8,9');
const LAUDO={
 piscina:{16:L('1,2,5'),15:L('1,5,6,7'),14:L('1,2,4,5,6,7,8,9'),13:L('1,2,3,5,8,9'),12:L('1,2,5,6,7,8,9'),11:T9,10:T9,9:T9,8:L('1,2,3,4,5,6,7'),7:T9,6:L('2,3,4,7,9'),5:L('2,3,6,7,8,9'),4:L('2,3,4,5,6'),3:T9,2:L('2,3,4,5,7,8,9'),1:L('1,2,3,7,8,9')},
 oposta:{15:L('1,2,3,7,9'),13:[6],12:[8,9],11:L('1,5,6,9'),10:L('1,4,5,6,7,8,9'),9:[4,6],8:L('4,5,6,7,8'),7:L('1,3,5,6,7'),6:[1,2,3],5:L('1,4,5,7,8,9'),4:L('1,2,3,7'),3:L('1,3,5,6'),2:[1,4,6],1:L('1,5,6,7,8,9'),0:[1,2,5,8]},
 rua:{15:[3,4],14:L('1,6,7,8'),13:L('1,3,4,5'),12:[1,5,8],11:L('1,2,3,9'),10:L('1,2,3,9'),9:[3],8:[3,7,9],7:L('1,3,6,7,8,9'),6:[3,6],5:[1,2,8],4:[3,5,9],3:L('3,7,8,9'),2:L('2,3,8,9')},
 churrasqueira:{15:[9],13:[2,3],12:[4,5,7],11:[7,8],10:L('2,3,7,8'),9:[1,3,8],8:L('1,2,3,5,6,8'),7:[3,4,6],6:[7,8,9],5:[3],4:[2,5,8],3:L('4,5,7,8,9'),2:[3,7],1:[3,4,7]}};

const PAV=16, PREF='croqui:';
let st={}; // st[fachada][quadro]=etapa
let aba='planta', pincel=1, verLaudo=true;

// Gera as células de uma fachada: {k, x, y, w, h, tipo, pav, q}
function celulas(F){
  const W=F.b.reduce((a,b)=>a+b[1],0), H=10, out=[]; let x=0;
  F.b.forEach((b,bi)=>{const [t,w]=b;
    for(let p=PAV;p>=0;p--){
      const y=(PAV-p)*H;
      if(p===0){ if(t==='f'&&F.terreoFaixa) sub(); continue; }
      if(t==='f') sub();
      else if(t!=='v') out.push({k:`${bi}-${p}`,x,y,w,h:H,t,pav:p,jan:b[3]||0});
      function sub(){for(let q=1;q<=9;q++){const c=(q-1)%3,r=Math.floor((q-1)/3);
        out.push({k:`${bi}-${p}-${q}`,x:x+c*w/3,y:y+r*H/3,w:w/3,h:H/3,t:'f',pav:p,q});}}
    }
    x+=w;});
  return {W,H,out};
}

function pct(F){
  const {out}=celulas(F), s=st[F.id]||{}; const r=[0,0,0,0,0,0]; let tot=0,totRem=0;
  out.forEach(c=>{const a=c.w*c.h, e=s[c.k]||0; tot+=a; if(c.t!=='s') totRem+=a;
    for(let k=1;k<=5;k++) if(e>=k){ if(k===1){ if(c.t!=='s') r[1]+=a; } else r[k]+=a; }});
  // Sacadas não têm remoção: contam a partir do tratamento
  return {rem:r[1]/totRem*100,k:[0,0,r[2]/tot*100,r[3]/tot*100,r[4]/tot*100,r[5]/tot*100],tot};
}

function desenho(F){
  const {W,H,out}=celulas(F), s=st[F.id]||{}, lau=LAUDO[F.id]||{}, sx=10;
  const larg=W*sx, alt=(PAV+1)*H*sx+ (F.terreoFaixa?0:0);
  let g='';
  // térreo
  g+=`<rect x="0" y="${PAV*H*sx}" width="${larg}" height="${H*sx}" fill="var(--cinza)"/>`;
  out.forEach(c=>{
    const e=s[c.k]||0, X=c.x*sx, Y=c.y*sx, w=c.w*sx, h=c.h*sx;
    g+=`<rect class="cel" data-k="${c.k}" x="${X}" y="${Y}" width="${w}" height="${h}" fill="${ETAPAS[e].c}"/>`;
    if(c.t==='s') g+=`<path d="M${X+3} ${Y+h-12}h${w-6}M${X+3} ${Y+h-18}h${w-6}" stroke="#6b5d3e" stroke-width="1.2" pointer-events="none"/>`;
    if(c.jan){const n=c.jan, jw=Math.min(w*.55/n,42), gap=(w-n*jw)/(n+1);
      for(let j=0;j<n;j++) g+=`<rect x="${X+gap+j*(jw+gap)}" y="${Y+h*.2}" width="${jw}" height="${h*.38}" fill="var(--vid)" stroke="#555" stroke-width=".8" pointer-events="none"/>`;}
    if(c.t==='f'){
      g+=`<text x="${X+w/2}" y="${Y+h/2+4}" font-size="${Math.min(11,h*.6)}" text-anchor="middle" fill="#333" pointer-events="none">${c.q}</text>`;
      if(verLaudo&&(lau[c.pav]||[]).includes(c.q)) g+=`<circle cx="${X+w-5}" cy="${Y+5}" r="3.2" fill="#d62828" pointer-events="none"/>`;
    }
  });
  // linhas de pavimento e rótulos
  for(let p=PAV;p>=1;p--){const y=(PAV-p)*H*sx;
    g+=`<line x1="0" x2="${larg}" y1="${y}" y2="${y}" stroke="#333" stroke-width="1.2" pointer-events="none"/>`;
    g+=`<text x="${larg+8}" y="${y+H*sx/2+5}" font-size="14" font-weight="700" fill="#333">PAV ${p}</text>`;}
  g+=`<text x="${larg+8}" y="${PAV*H*sx+H*sx/2+5}" font-size="14" font-weight="700" fill="#333">TÉRREO</text>`;
  g+=`<rect x="0" y="0" width="${larg}" height="${alt}" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>`;
  // rótulos dos blocos de sacada no topo
  let x=0; F.b.forEach(b=>{ if(b[2]) g+=`<text x="${(x+b[1]/2)*sx}" y="-6" font-size="12" text-anchor="middle" fill="#6b5d3e">${b[2]}</text>`; x+=b[1];});
  return `<svg viewBox="-2 -22 ${larg+84} ${alt+26}" id="svg">${g}</svg>`;
}

function barras(F){
  const p=pct(F), f=v=>v.toFixed(1).replace('.',',')+'%';
  const it=[[1,p.rem,'Remoção de pastilhas (exceto sacadas)'],[2,p.k[2],'Tratamento / regularização'],[3,p.k[3],'Fundo preparador'],[4,p.k[4],'Revestimento final'],[5,p.k[5],'Aprovado pela fiscalização']];
  return it.map(([e,v,n])=>`<div class="lin"><span>${n}</span><b>${f(v)}</b></div><div class="bar"><i style="width:${v}%;background:${ETAPAS[e].c}"></i></div>`).join('');
}


// ===== Planta baixa (croqui de pastilhas da Diagnóstika, 18/12/2025) =====
// pts = posição no desenho original (sem escala). c = cota de largura (m), a = área (m²)
// fc = fachada no cronograma da AAM, fd = fachada pelo desenho; conf = ponto a conferir
const FAIXAS=[
 {id:'b1',pts:[[363,1062],[495,1062]],c:2,a:96,fc:'oposta',fd:'oposta',esc:1},
 {id:'b2',pts:[[495,1062],[637,1062]],c:3,a:112,fc:'oposta',fd:'oposta',conf:'112 ÷ 3,00 = 37,3 m de altura (as faixas de 2,00 e 4,50 dão 48 m).'},
 {id:'b3',pts:[[637,1062],[818,1062]],c:4,a:147.2,fc:'oposta',fd:'oposta',conf:'147,2 ÷ 4,00 = 36,8 m de altura.'},
 {id:'b4',pts:[[818,1062],[846,1062]],c:.5,a:32,fc:'oposta',fd:'oposta',esc:1,conf:'0,50 × 48 m = 24 m². O croqui diz 32 m² (daria 64 m de altura).'},
 {id:'b5',pts:[[846,1062],[938,1132]],c:2,a:96,fc:'oposta',fd:'oposta',esc:1},
 {id:'b6',pts:[[938,1132],[1165,1132]],c:4.5,a:216,fc:'oposta',fd:'oposta',esc:1},
 {id:'b7',pts:[[1165,1132],[1257,1062]],c:2,a:96,fc:'oposta',fd:'oposta',esc:1},
 {id:'b8',pts:[[1257,1062],[1283,1062]],c:.5,a:32,fc:'oposta',fd:'oposta',esc:1,conf:'0,50 × 48 m = 24 m². O croqui diz 32 m² (daria 64 m de altura).'},
 {id:'b9',pts:[[1283,1062],[1440,1062]],c:4,a:147.2,fc:'oposta',fd:'oposta',conf:'147,2 ÷ 4,00 = 36,8 m de altura.'},
 {id:'b10',pts:[[1440,1062],[1583,1062]],c:3,a:112,fc:'oposta',fd:'oposta',conf:'112 ÷ 3,00 = 37,3 m de altura.'},
 {id:'b11',pts:[[1583,1062],[1694,1062]],c:2,a:96,fc:'oposta',fd:'oposta',esc:1},
 {id:'r1',pts:[[1646,614],[1646,737]],c:2,a:96,fc:'piscina',fd:'rua',conf:'No desenho fica do lado da portaria; o cronograma conta como Fachada Piscina.'},
 {id:'r2',pts:[[1653,791],[1694,791]],c:null,a:8,fc:'rua',fd:'rua',conf:'Sem cota de largura no croqui.'},
 {id:'r3',pts:[[1694,797],[1694,1055]],c:5,a:182.4,fc:'rua',fd:'rua',conf:'182,4 ÷ 5,00 = 36,5 m de altura.'},
 {id:'f1',pts:[[369,614],[369,737]],c:2,a:96,fc:'churrasqueira',fd:'churrasqueira'},
 {id:'f2',pts:[[322,791],[363,791]],c:null,a:8,fc:'rua',fd:'churrasqueira',conf:'Sem cota. No desenho fica do lado da churrasqueira; o cronograma soma na Frente.'},
 {id:'f3',pts:[[322,797],[322,1008]],c:4,a:121.6,fc:'churrasqueira',fd:'churrasqueira',conf:'121,6 ÷ 4,00 = 30,4 m de altura (cota pouco clara no desenho).'},
 {id:'f4',pts:[[322,1014],[363,1014]],c:null,a:16,fc:'churrasqueira',fd:'churrasqueira',esc:1,conf:'Sem cota de largura no croqui.'},
 {id:'t1',pts:[[363,555],[598,555]],c:5,a:80,fc:'piscina',fd:'piscina',conf:'80 ÷ 5,00 = 16 m de altura. Pastilha só em parte da altura?'},
 {id:'t2',pts:[[605,485],[605,562]],c:1.5,a:40,fc:'piscina',fd:'piscina',esc:1,conf:'40 ÷ 1,50 = 26,7 m de altura, diferente de todas as outras.'},
 {id:'t3',pts:[[605,485],[710,485]],c:2,a:96,fc:'piscina',fd:'piscina',esc:1},
 {id:'t4',pts:[[873,485],[995,485]],c:2,a:32,fc:'piscina',fd:'piscina',conf:'32 ÷ 2,00 = 16 m de altura.'},
 {id:'t5',pts:[[995,485],[1165,485]],c:3,a:48,fc:'piscina',fd:'piscina',conf:'48 ÷ 3,00 = 16 m de altura.'},
 {id:'t6',pts:[[1259,555],[1401,555]],c:3,a:144,fc:'piscina',fd:'piscina',esc:1},
 {id:'t7',pts:[[1401,555],[1653,555]],c:5,a:80,fc:'piscina',fd:'piscina',conf:'80 ÷ 5,00 = 16 m de altura. Pastilha só em parte da altura?'}];
const CRONO={piscina:616,oposta:1182.4,rua:198.4,churrasqueira:233.6};
const COR={piscina:'#4f86b5',oposta:'#a8743f',rua:'#0f6e74',churrasqueira:'#7d8a2e'};
let selF=null, divisao='fc';
const br=v=>v.toLocaleString('pt-BR',{maximumFractionDigits:2});

function planta(){
  const contorno='363,555 605,555 605,485 710,485 765,419 873,419 873,485 1165,485 1259,555 1653,555 1653,791 1694,791 1694,1062 1257,1062 1165,1132 938,1132 846,1062 363,1062 363,1014 322,1014 322,791 363,791';
  let g=`<rect x="233" y="137" width="383" height="110" fill="#cfe3dc" stroke="#7a9"/><text x="424" y="198" font-size="22" text-anchor="middle" fill="#355">PISCINA</text>`;
  g+=`<polygon points="${contorno}" fill="#eef0f0" stroke="#555" stroke-width="2"/>`;
  g+=`<text x="770" y="465" font-size="20" fill="#555">SACADA</text><text x="1120" y="530" font-size="20" fill="#555">SACADA</text>`;
  g+=`<text x="1010" y="800" font-size="24" text-anchor="middle" fill="#999">Ed. Menotti del Picchia</text>`;
  g+=`<text transform="translate(1790 930) rotate(-90)" font-size="22" text-anchor="middle" fill="#333">PORTARIA / FRENTE (RUA)</text>`;
  g+=`<text transform="translate(262 900) rotate(-90)" font-size="22" text-anchor="middle" fill="#333">CHURRASQUEIRA / FUNDO</text>`;
  g+=`<text x="1010" y="1205" font-size="20" text-anchor="middle" fill="#333">OPOSTA À PISCINA</text>`;
  FAIXAS.forEach(f=>{
    const d='M'+f.pts.map(p=>p.join(' ')).join('L'), fa=f[divisao], on=selF===f.id;
    const [a,b]=f.pts, mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, vert=Math.abs(a[0]-b[0])<Math.abs(a[1]-b[1]);
    if(f.conf) g+=`<path d="${d}" stroke="#f2c200" stroke-width="30" fill="none" pointer-events="none"/>`;
    g+=`<path d="${d}" stroke="${COR[fa]}" stroke-width="${on?22:16}" fill="none" pointer-events="none"/>`;
    if(on) g+=`<path d="${d}" stroke="#000" stroke-width="4" fill="none" pointer-events="none"/>`;
    g+=`<path d="${d}" data-f="${f.id}" stroke="transparent" stroke-width="44" fill="none" style="cursor:pointer"/>`;
    const tx=vert?mx+(mx>1000?34:-34):mx, ty=vert?my:my+(my>700?42:-24);
    g+=`<text x="${tx}" y="${ty}" font-size="17" text-anchor="middle" fill="#222" pointer-events="none"${vert?` transform="rotate(-90 ${tx} ${ty})"`:''}>${br(f.a)}</text>`;
  });
  return `<svg viewBox="200 120 1640 1110" id="svgp">${g}</svg>`;
}

function painelPlanta(){
  const soma={}; FACH.forEach(F=>soma[F.id]=0); FAIXAS.forEach(f=>soma[f[divisao]]+=f.a);
  const tot=FAIXAS.reduce((s,f)=>s+f.a,0);
  let h=`<div class="card"><h3>Áreas de pastilha por fachada</h3>
  <div class="acoes" style="margin:0 0 10px"><label><input type="radio" name="dv" ${divisao==='fc'?'checked':''} onchange="divisao='fc';render()"> Como no cronograma AAM</label>
  <label><input type="radio" name="dv" ${divisao==='fd'?'checked':''} onchange="divisao='fd';render()"> Como no desenho</label></div>`;
  FACH.forEach(F=>{const p=pct(F);
    h+=`<div class="lin" style="cursor:pointer" onclick="aba='${F.id}';render()"><span><span class="sw" style="background:${COR[F.id]};vertical-align:-3px"></span> ${F.n}</span><b>${br(soma[F.id])} m²</b></div>
    <div class="mut" style="margin:0 0 8px 22px">Cronograma ${br(CRONO[F.id])} m² · revestimento final ${p.k[4].toFixed(1).replace('.',',')}%</div>`;});
  h+=`<div class="lin" style="border-top:1px solid var(--bd);padding-top:6px"><span>Total</span><b>${br(tot)} m²</b></div></div>`;
  const f=FAIXAS.find(x=>x.id===selF);
  if(f){const F=FACH.find(x=>x.id===f[divisao]);
    h+=`<div class="card" style="margin-top:12px"><h3>Faixa selecionada</h3>
    <div class="lin"><span>Área</span><b>${br(f.a)} m²</b></div>
    <div class="lin"><span>Largura (cota)</span><b>${f.c?br(f.c)+' m':'sem cota'}</b></div>
    <div class="lin"><span>Altura implícita</span><b>${f.c?br(+(f.a/f.c).toFixed(1))+' m':'—'}</b></div>
    <div class="lin"><span>Pastilha</span><b>${f.esc?'escura':'clara'}</b></div>
    ${f.conf?`<p style="background:#fff6cc;border:1px solid #f2c200;border-radius:8px;padding:8px;margin:8px 0">A conferir: ${f.conf}</p>`:''}
    <div class="acoes"><button onclick="aba='${F.id}';render()">Abrir ${F.n}</button></div></div>`;}
  h+=`<p class="mut" style="margin-top:10px">Contorno e áreas (m²) do croqui de pastilhas da Diagnóstika de 18/12/2025, sem escala. Borda amarela = medida a conferir em campo. Toque numa faixa para ver o detalhe.</p>`;
  return h;
}

function render(){
  document.getElementById('tabs').innerHTML=[['planta','Planta'],...FACH.map(F=>[F.id,F.n.replace('Fachada ','')]),['geral','Visão geral']]
    .map(([id,n])=>`<button class="${aba===id?'on':''}" onclick="aba='${id}';render()">${n}</button>`).join('');
  const M=document.getElementById('main');
  if(aba==='planta'){
    M.innerHTML=`<div class="lay"><div class="card">${planta()}</div><div>${painelPlanta()}</div></div>`;
    document.getElementById('pal').style.display='none';
    document.getElementById('svgp').addEventListener('click',ev=>{const id=ev.target.dataset&&ev.target.dataset.f; selF=id&&id!==selF?id:null; render();});
    return;
  }
  if(aba==='geral'){
    let tot=0,ac=0; FACH.forEach(F=>{const p=pct(F); tot+=p.tot; ac+=p.k[4]*p.tot;});
    M.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="mut">Revestimento final concluído, ponderado pela área desenhada</div><div class="big">${(ac/tot).toFixed(1).replace('.',',')}%</div></div>
    <div class="geral">${FACH.map(F=>`<div class="card"><h3>${F.n}</h3>${barras(F)}</div>`).join('')}</div>`;
    document.getElementById('pal').style.display='none'; return;
  }
  document.getElementById('pal').style.display='';
  const F=FACH.find(f=>f.id===aba);
  M.innerHTML=`<div class="lay"><div class="card">${desenho(F)}</div>
  <div><div class="card"><h3>${F.n}</h3>${barras(F)}
  <div class="acoes"><label><input type="checkbox" ${verLaudo?'checked':''} onchange="verLaudo=this.checked;render()"> Patologias do laudo</label>
</div>
  <p class="mut" style="margin-top:10px">Bolinha vermelha = quadrante com patologia no laudo. Faixas marcadas como Sacadas ficam fora da remoção (regularização sobre a pastilha + revestimento). Proporções tiradas dos desenhos do laudo; ainda não conferidas em campo.</p></div></div></div>`;
  document.getElementById('svg').addEventListener('click',ev=>{const k=ev.target.dataset&&ev.target.dataset.k; if(!k)return;
    st[F.id]=st[F.id]||{}; if((st[F.id][k]||0)===pincel) delete st[F.id][k]; else st[F.id][k]=pincel; mapaGravar(PREF+F.id+':'+k,st[F.id][k]||0); render();});
  document.getElementById('pal').innerHTML=ETAPAS.map((e,i)=>`<button class="${pincel===i?'on':''}" onclick="pincel=${i};render()"><span class="sw" style="background:${e.c}"></span>${e.n}</button>`).join('');
}

render();

// ---------- dados compartilhados ----------
async function recarregar(){
  try{const d=await mapaCarregar(PREF); st={};
    Object.values(d).forEach(r=>{const [f,...k]=r.chave.slice(PREF.length).split(':'); if(r.etapa) (st[f]=st[f]||{})[k.join(':')]=r.etapa;});
    render(); statusSync();
  }catch(e){document.getElementById('sync').textContent='⚠️ não consegui ler as marcações do servidor';}
}
mapaEntrar().then(ok=>{if(!ok) return; recarregar(); document.addEventListener('visibilitychange',()=>{if(!document.hidden) recarregar();});});
</script>
</body>
