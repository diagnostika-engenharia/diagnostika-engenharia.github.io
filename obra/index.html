<head>

<style>
:root{
  --teal:#155B67;--teal-dk:#0D3C44;--teal-md:#1E7A8A;
  --turq:#00B4AC;--turq-lt:#CCF0EE;--turq-dk:#008A83;
  --lime:#8DB72A;--lime-lt:#EDF5D8;
  --red:#C00000;--red-lt:#FFEAEA;--red-md:#E53935;
  --amber:#B7791F;--amber-lt:#FFF4D6;
  --green:#1B8A4A;--green-lt:#E8F5EE;
  --gray:#F0F4F5;--gray2:#E0EAEC;--gray3:#A8BFC2;--gray4:#5A7A7E;
  --white:#FFFFFF;--text:#1A2E31;--text2:#4A6568;
  --shadow:0 2px 12px rgba(21,91,103,.12);
  --r:14px;--r-sm:8px;--nav-h:64px;--header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--gray);color:var(--text);font-size:15px}
body{overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--white);position:relative}
#header{height:var(--header-h);min-height:var(--header-h);background:var(--teal);color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;padding-top:env(safe-area-inset-top)}
#header .back{background:none;border:0;color:#fff;font-size:22px;width:34px;height:34px;border-radius:50%;display:none;align-items:center;justify-content:center}
#header .back.show{display:flex}
#header .logo{display:flex;align-items:center;flex:none}
#header .logo img{height:30px;width:30px;border-radius:8px;background:#fff;padding:2px;display:block}
#header .ttl{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#header .sub{font-size:11px;opacity:.8;font-weight:400;display:block}
#sync{font-size:11px;padding:4px 8px;border-radius:12px;background:rgba(255,255,255,.15);white-space:nowrap}
#sync.pend{background:var(--amber)}
#sync.off{background:var(--red-md)}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--nav-h) + 20px)}
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--gray2);display:flex}
#nav button{flex:1;border:0;background:none;font-size:11px;color:var(--gray4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600}
#nav button .ic{font-size:22px}
#nav button.on{color:var(--teal)}
.card{background:#fff;border:1px solid var(--gray2);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:14px;color:var(--teal);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.obra-hd{background:linear-gradient(135deg,var(--teal-dk),var(--teal));color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.obra-hd b{font-size:16px;display:block;margin-bottom:4px}
.obra-hd small{opacity:.85;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--gray);border-radius:var(--r-sm);padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--teal)}
.stat small{font-size:11px;color:var(--text2)}
.stat.nc b{color:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:0;border-radius:var(--r-sm);font-size:15px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff}
.btn.sec{background:var(--gray);color:var(--teal)}
.btn.lime{background:var(--lime);color:#fff}
.btn.red{background:var(--red-md);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1}
label.f{display:block;font-size:12px;color:var(--text2);font-weight:600;margin:10px 0 4px}
input.f,select.f,textarea.f{width:100%;padding:11px;border:1.5px solid var(--gray2);border-radius:var(--r-sm);font-size:15px;background:#fff;color:var(--text);font-family:inherit}
textarea.f{min-height:76px;resize:vertical}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{border:1.5px solid var(--gray2);background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.ck{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--gray2)}
.ck:last-child{border-bottom:0}
.ck .lb{flex:1;font-size:14px;line-height:1.3}
.ck .lb small{display:block;color:var(--red);font-size:11px;margin-top:2px}
.seg{display:flex;border:1.5px solid var(--gray2);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:#fff;padding:8px 10px;font-size:12px;font-weight:700;color:var(--gray4);min-width:38px}
.seg button+button{border-left:1.5px solid var(--gray2)}
.seg button.ok{background:var(--green);color:#fff}
.seg button.nc{background:var(--red-md);color:#fff}
.seg button.na{background:var(--gray3);color:#fff}
.seg button.s0{background:var(--gray3);color:#fff}
.seg button.s1{background:var(--amber);color:#fff}
.seg button.s2{background:var(--green);color:#fff}
.pct{width:64px;padding:8px 6px;border:1.5px solid var(--gray2);border-radius:8px;font-size:14px;text-align:center}
.fach{margin-bottom:10px}
.fach .fbadge{background:var(--red,#b91c1c);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:8px;white-space:nowrap}
.fach summary>span:first-child{display:flex;align-items:center;flex:1;min-width:0}
.fach summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--turq-lt);border-radius:var(--r-sm);font-weight:700;color:var(--teal-dk);cursor:pointer}
.fach summary::-webkit-details-marker{display:none}
.fach summary .bar{height:6px;background:#fff;border-radius:3px;width:80px;overflow:hidden}
.fach summary .bar i{display:block;height:100%;background:var(--lime)}
.fach .body{padding:6px 4px 0}
.reg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray2)}
.reg:last-child{border-bottom:0}
.reg .th{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--gray);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.reg .bd{flex:1;min-width:0}
.reg .bd.ed{cursor:pointer}.reg .bd.ed:active{opacity:.6}.edh,.reg .bd .edh{font-size:11px;color:var(--teal,#1a9c8f);margin-left:6px}
.photos .ex{position:relative;display:inline-block}.photos .ex img.rm{opacity:.3;outline:2px solid var(--red)}.photos .ex small{position:absolute;left:0;right:0;bottom:0;background:#0008;color:#fff;font-size:10px;text-align:center;border-radius:0 0 8px 8px}
.reg .bd b{font-size:14px;display:block}
.reg .bd p{font-size:13px;color:var(--text2);margin-top:2px;white-space:pre-wrap}
.reg .bd p.tx{color:var(--text);border-left:3px solid var(--teal,#1a9c8f);padding-left:6px;font-style:italic}
.reg .bd small{font-size:11px;color:var(--gray4)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--gray);color:var(--text2);margin-right:4px;text-transform:uppercase}
.tag.nc{background:var(--red-lt);color:var(--red)}
.tag.ok{background:var(--green-lt);color:var(--green)}
.tag.oc{background:var(--amber-lt);color:var(--amber)}
.tag.res{background:var(--green-lt);color:var(--green)}
.fab{position:absolute;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--lime);color:#fff;border:0;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:5}
.fab.show{display:flex}
.modal{position:absolute;inset:0;background:rgba(13,60,68,.55);display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;color:var(--teal);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--gray2);background:#fff;border-radius:16px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--text2)}
.chips button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.chips button.on.nc{background:var(--red-md);border-color:var(--red-md)}
.chips button small{display:block;font-weight:400;font-size:10px;opacity:.8}
.eqrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--gray1)}.eqrow .nm{flex:1;min-width:0}.eqrow .nm small{display:block;color:var(--text2);font-size:12px}.eqrow.off .nm{opacity:.45;text-decoration:line-through}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--gray2)}
.photos .add{width:72px;height:72px;border:2px dashed var(--gray3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gray4);background:#fff}
.rec{display:flex;align-items:center;gap:10px;margin-top:10px}
.rec button{border:0;border-radius:20px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--gray);color:var(--teal)}
.rec button.on{background:var(--red-md);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.vis{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--gray2)}
.vis:last-child{border-bottom:0}
.vis .d{width:48px;text-align:center;background:var(--turq-lt);border-radius:8px;padding:6px 0;color:var(--teal-dk);font-weight:700;font-size:12px;line-height:1.2}
.vis .d b{font-size:18px;display:block}
.vis .i{flex:1;min-width:0}
.vis .i b{font-size:14px;display:block}
.vis .i small{color:var(--text2);font-size:12px}
.vis .ar{color:var(--gray3);font-size:20px}
.empty{text-align:center;color:var(--gray4);padding:30px 10px;font-size:14px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);background:var(--teal-dk);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.lightbox{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:40}
.lightbox .mkb{position:absolute;top:10px;left:10px;background:#fff2;color:#fff;border:1px solid #fff8;border-radius:8px;padding:8px 12px;font-size:14px;z-index:2}
/* marcação de evidências nas fotos */
.mk{position:fixed;inset:0;background:#111;z-index:50;display:none;flex-direction:column;touch-action:none;overscroll-behavior:none}.mk.show{display:flex}
.mk-top,.mk-bot{display:flex;gap:6px;padding:8px calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left));background:#222;align-items:center;flex-wrap:wrap;flex-shrink:0}.mk-bot{padding-bottom:calc(8px + env(safe-area-inset-bottom))}.mk-top{padding-top:calc(8px + env(safe-area-inset-top))}
.mk-top button,.mk-bot button{background:#3a3a3a;color:#fff;border:0;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;font-family:inherit}.mk-t.on{background:var(--teal-md)}
.mk-c{width:36px;height:36px;border-radius:50%!important;padding:0!important;border:3px solid #0000!important}.mk-c.on{border-color:#fff!important}.mk-sp{flex:1}.mk-z{min-width:40px;padding:10px 8px!important}
.mk-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;touch-action:none}#mkCv{max-width:100%;max-height:100%;touch-action:none;display:block;cursor:crosshair;transform-origin:50% 50%;will-change:transform}
.mk-bot .pri{background:var(--teal-md);flex:1}.mk-bot .pul{background:#555}
body.mk-on{overflow:hidden;touch-action:none}
.photos .ex .mkb{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border:0;border-radius:6px;font-size:12px;padding:3px 6px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%}
.lightbox button{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);border:0;color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%}
.lightbox .nav{top:50%;transform:translateY(-50%);width:48px;height:64px;border-radius:8px;font-size:32px;left:8px;right:auto}.lightbox .nav.nx{left:auto;right:8px}.lightbox .cnt{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:12px;font-size:14px}.lightbox .nav[hidden],.lightbox .cnt[hidden]{display:none}
.muted{color:var(--text2);font-size:12px}
.and-grid{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:900px){.and-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}.and-grid .card{margin:0}}
body.auth-checking #app>*{visibility:hidden}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#0D3C44,#155B67);color:#fff;display:flex;align-items:center;justify-content:center;z-index:99;font-size:14px;padding:20px;text-align:center}
#gate .bx{background:#fff;color:var(--text);border-radius:16px;padding:28px;max-width:400px}
#gate .bx h2{color:var(--teal);font-size:19px;margin:10px 0}
#gate a{display:inline-block;background:var(--teal);color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:700;margin-top:8px}
/* ── Computador: menu lateral, conteúdo largo, janelas centralizadas ── */
@media (min-width:900px){
  #app{max-width:none;display:grid;grid-template-columns:230px 1fr;grid-template-rows:var(--header-h) minmax(0,1fr);background:var(--gray)}
  #header{grid-column:1/-1;padding:0 24px}
  #header .ttl{font-size:17px}
  #nav{position:static;grid-column:1;grid-row:2;height:auto;padding:18px 12px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--gray2);background:#fff}
  #nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:12px 14px;border-radius:10px;cursor:pointer}
  #nav button .ic{font-size:20px}
  #nav button:hover{background:var(--gray)}
  #nav button.on{background:var(--turq-lt);color:var(--teal-dk)}
  #view{grid-column:2;grid-row:2;padding:24px 32px 40px}
  #view>*{max-width:1100px;margin-left:auto;margin-right:auto}
  #view>.btn{max-width:1100px}
  .stat{padding:16px}
  .stat b{font-size:28px}
  .stat small{font-size:13px}
  .vis,.reg,.fach summary,.tabs button,.chips button,.seg button,.btn{cursor:pointer}
  .vis:hover{background:var(--gray)}
  .fab{right:36px;bottom:32px}
  .modal{align-items:center;justify-content:center}
  .sheet{max-width:640px;max-height:88%;border-radius:18px;padding:22px 24px 26px}
  .toast{bottom:32px}
  .reg .th{width:88px;height:88px}
  .photos img,.photos .add{width:96px;height:96px}
}
</style>
</head>

const climaLista=v=>(v||'').split(',').map(x=>x.trim()).filter(Boolean);
function climaToggle(atual,c){const l=climaLista(atual);const i=l.indexOf(c);if(i>=0)l.splice(i,1);else l.push(c);return CLIMAS.filter(x=>l.includes(x)).concat(l.filter(x=>!CLIMAS.includes(x))).join(', ');}

const equipeAtiva=()=>equipe.filter(f=>f.ativo!==false);
const ehEncarregado=f=>/^encarregad/i.test(f||'');
const ordemFuncao=f=>{if(ehEncarregado(f))return 0;const i=FUNCOES.indexOf(f);return i<0?99:i;};
// Recalcula o efetivo por função a partir dos presentes nominais (mantém funções sem cadastro informadas à mão)
// Funções com cadastro (e "Encarregado") são sempre derivadas dos presentes; as demais ficam manuais (gente sem cadastro)
function efetivoDosPresentes(pres,efAtual,enc){
  const ef={...(efAtual||{})};pres=pres||[];
  ['Encarregado',...equipe.map(f=>f.funcao),...pres.map(p=>p.funcao)].forEach(f=>ef[f]=0);
  let encContado=false;
  pres.forEach(p=>{const f=(enc&&p.nome===enc)?(encContado=true,'Encarregado'):p.funcao;ef[f]=(ef[f]||0)+1;});
  if(enc&&!encContado&&!equipe.some(f=>f.nome===enc))ef['Encarregado']=1; // só o encarregado digitado (sem cadastro) conta automaticamente; cadastrado precisa estar marcado presente
  return ef;
}
let efExpand=false;
// Linhas do efetivo: só funções com gente aparecem; "ajustar" mostra todas para digitar função sem cadastro
function linhasEfetivo(ef,attr,rerender){
  const funcs=[...new Set([...FUNCOES,...equipe.map(x=>x.funcao)])].sort((a,b)=>ordemFuncao(a)-ordemFuncao(b));
  const vis=f=>efExpand||+ef[f]>0;
  const temEq=equipeAtiva().length>0;
  return funcs.map(f=>`<div class="ck" style="${vis(f)?'':'display:none'}"><span class="lb">${esc(f)}</span><input class="pct" inputmode="numeric" value="${ef[f]??''}" placeholder="0" ${attr(f)}></div>`).join('')
    +(temEq?`<button type="button" style="background:none;border:0;color:var(--teal,#0f766e);font-size:13px;padding:6px 0;text-decoration:underline" onclick="efExpand=!efExpand;${rerender}">${efExpand?'Ocultar funções zeradas':'+ Ajustar / incluir gente sem cadastro'}</button>`:'');
}
const ehAvulso=p=>!!(p&&(p.sem_cadastro||String(p.id||'').startsWith('avulso-')));
let avulsoAberto=false;
function chipsPresentes(pres,onToggle){
  const at=equipeAtiva();const sel=new Set(pres.map(p=>p.id));
  const avulsos=pres.filter(ehAvulso);
  const funcs=[...new Set([...FUNCOES,...equipe.map(x=>x.funcao),'Ajudante de Pintor'])].sort((a,b)=>ordemFuncao(a)-ordemFuncao(b));
  const onAdd=onToggle==='togPresente'?'addAvulso()':'addAvulsoEdicao()';
  const form=avulsoAberto?`<div class="card" style="margin:8px 0;padding:10px;border:1px dashed #d97706;background:#fffbeb">
      <label class="f" style="margin-top:0">Nome ou apelido</label><input class="f" id="av_nome" placeholder="Ex.: Antônio Pereira da Silva">
      <label class="f">Função</label><input class="f" id="av_func" list="av_funcs" placeholder="Ex.: Ajudante de Pintor"><datalist id="av_funcs">${funcs.map(f=>`<option value="${esc(f)}">`).join('')}</datalist>
      <p class="muted" style="font-size:12px;margin-top:6px">Entra na vistoria marcado como <b>sem documentação identificada</b>. Não vai para o cadastro da equipe.</p>
      <div class="row"><button type="button" class="btn" onclick="${onAdd}">Incluir na vistoria</button><button type="button" class="btn sec" onclick="avulsoAberto=false;${onToggle==='togPresente'?'render()':'togPresenteEdicao()'}">Cancelar</button></div>
    </div>`:'';
  const btn=`<button type="button" style="background:none;border:0;color:#b45309;font-size:13px;padding:6px 0;text-decoration:underline" onclick="avulsoAberto=true;${onToggle==='togPresente'?'render()':'togPresenteEdicao()'}">+ Adicionar profissional não cadastrado</button>`;
  const chips=at.map(f=>`<button class="${sel.has(f.id)?'on':''}" onclick="${onToggle}('${f.id}')">${esc(f.nome)}<small>${esc(f.funcao)}</small></button>`)
    .concat(avulsos.map(p=>`<button class="on" style="background:#b45309;border-color:#b45309" title="Toque para remover" onclick="${onToggle}('${esc(p.id)}')">⚠ ${esc(p.nome)}<small>${esc(p.funcao)} · sem documentação</small></button>`)).join('');
  const aviso=!at.length?`<p class="muted">Nenhum funcionário cadastrado. Cadastre a equipe na tela Obra para marcar presença pelo nome.</p>`:'';
  return `${aviso}${chips?`<div class="chips">${chips}</div>`:''}${avulsoAberto?form:btn}`;
}
function novoAvulso(){

async function comprimir(file,max=1600,q=.82){
  const bmp=await createImageBitmap(file).catch(()=>null);
  if(!bmp) return file;
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',q));
}

// ═══════════════ IndexedDB — fila offline ═══════════════
const idb={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('obra-dk',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('ops',{keyPath:'id',autoIncrement:true});};r.onsuccess=e=>{this.db=e.target.result;res();};r.onerror=()=>rej(r.error);});},
  tx(mode){return this.db.transaction('ops',mode).objectStore('ops');},
  add(op){return new Promise((res,rej)=>{const r=this.tx('readwrite').add(op);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  all(){return new Promise((res,rej)=>{const r=this.tx('readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  del(id){return new Promise((res,rej)=>{const r=this.tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});},
  count(){return new Promise((res,rej)=>{const r=this.tx('readonly').count();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
};
let syncing=false;
async function enfileirar(op){await idb.add({...op,ts:Date.now()});atualizarSync();sincronizar();}
async function atualizarSync(){
  const n=await idb.count().catch(()=>0);const el=$('sync');
  if(!navigator.onLine){el.textContent=`⛔ offline · ${n} pend.`;el.className='off';}
  else if(n>0){el.textContent=`⏳ ${n} pendente${n>1?'s':''}`;el.className='pend';}
  else{el.textContent='✓ sincronizado';el.className='';}
}
let syncAgain=false;
// ── Concorrência (item 1 da checagem 20/10): a vistoria só é gravada com update condicionado ao
// updated_at que lemos do servidor; se outro aparelho gravou antes, avisa e NÃO sobrescreve.
const srvUpd={};                 // último updated_at conhecido por vistoria (memória)
const conflitos=[];              // avisos de gravação recusada (mostrados na Fila)
const CAMPOS_FIXOS=new Set(['id','obra_id','created_at','updated_at']);
const normCampo=(k,v)=>(k==='hora_inicio'||k==='hora_fim')?(v?String(v).slice(0,5):null):(v??null);
// só os campos que mudaram em relação ao que o servidor conhece (base)
// cópia profunda: _sent nunca pode compartilhar o mesmo array/objeto da vistoria viva (senão togglar presente altera o 'enviado' junto e o diff sai vazio)
const cloneRow=o=>JSON.parse(JSON.stringify(o));
function diffRow(novo,base){const p={};for(const k of Object.keys(novo||{})){if(CAMPOS_FIXOS.has(k))continue;if(JSON.stringify(normCampo(k,novo[k]))!==JSON.stringify(normCampo(k,base?.[k])))p[k]=novo[k];}return p;}
const vidDe=op=>op.vid||op.visita_id||op.row?.visita_id||(op.kind==='visita'?op.row?.id:null);
function registrarUpd(vid,u,patch){srvUpd[vid]=u;if(visita&&visita.id===vid){visita._srv_updated_at=u;saveVisita();}const cv=cacheVisitas.find(x=>x.id===vid);if(cv)Object.assign(cv,patch||{},{updated_at:u});}
function conflitoVisita(op,atual){
  const quando=atual?.updated_at?fmtBR(String(atual.updated_at).slice(0,10))+' '+fmtHora(atual.updated_at):'';
  const msg=`A vistoria de ${fmtBR(atual?.data||op.data)} foi alterada em outro aparelho${atual?.engenheiro?' ('+nomeCompleto(atual.engenheiro)+')':''}${quando?' em '+quando:''}. Alterações NÃO gravadas: ${Object.keys(op.patch||{}).join(', ')||'—'}.`;
  conflitos.push({vid:op.vid,msg,ts:Date.now()});
  if(visita&&visita.id===op.vid&&!visita._conflito){visita._conflito=msg;saveVisita();}
  toast('⚠️ '+msg);rerender();
}
async function removerStorage(paths){if(paths&&paths.length){try{await sb.storage.from(BUCKET).remove(paths);}catch(e){console.warn('storage.remove:',e);}}}
// Sobe as fotos de um item; se uma falhar, apaga as que já subiram (nada de órfãos) e relança
async function uploadBlobs(op,visitaId){
  const paths=[];
  for(const it of (op.blobs||[])){
    // it = Blob (sem marcação) ou {m:Blob marcada, o:Blob original}; a original fica em <stamp>_orig.jpg e só a marcada entra em fotos
    const b=it&&it.m?it.m:it;const stamp=`${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
    const path=`${OBRA_ID}/${visitaId}/${stamp}.jpg`,orig=`${OBRA_ID}/${visitaId}/${stamp}_orig.jpg`;
    if(it&&it.o){const {error:eo}=await sb.storage.from(BUCKET).upload(orig,it.o,{contentType:'image/jpeg',cacheControl:'31536000'});if(eo){await removerStorage(paths);throw eo;}}
    const {error}=await sb.storage.from(BUCKET).upload(path,b,{contentType:'image/jpeg',cacheControl:'31536000'});
    if(error){await removerStorage(it&&it.o?[...paths,orig]:paths);throw error;}
    paths.push(path);
  }
  return paths;
}
async function uploadAudio(op,visitaId){
  if(!op.audio)return null;
  const audio_path=`${OBRA_ID}/${visitaId}/audio_${Date.now()}.${audioExt(op.audio)}`;
  const {error}=await sb.storage.from(BUCKET).upload(audio_path,op.audio,{contentType:op.audio.type||'audio/webm'});
  if(error)throw error;return audio_path;
}
// Se já há uma sincronização em curso, espera ela terminar e roda de novo (garante que
// quem chamou "await sincronizar()" só continua com a fila realmente esvaziada).
async function sincronizar(){
  if(!navigator.onLine||!sb) return;
  if(syncing){syncAgain=true;return syncing;}
  syncing=(async()=>{do{syncAgain=false;await sincronizarFila();}while(syncAgain);})().finally(()=>{syncing=null;atualizarSync();});
  return syncing;
}
// Fila (item 8): um item com falha bloqueia só os itens seguintes DA MESMA vistoria (a ordem por vistoria importa);
// as demais seguem. A linha do registro sobe antes das fotos; se a gravação das fotos falhar, elas são apagadas do storage.
async function sincronizarFila(){
  try{
    const ops=await idb.all();
    const bloqueadas=new Set();
    for(const op of ops){
      const vid=vidDe(op);
      if(vid&&bloqueadas.has(vid))continue;
      try{
        if(op.kind==='visita'){const {data,error}=await sb.from('obra_visitas').upsert(op.row,{onConflict:'id'}).select('updated_at');if(error)throw error;if(data?.[0])registrarUpd(op.row.id,data[0].updated_at,op.row);}
        else if(op.kind==='visita_patch'){
          const tentar=async e=>{let q=sb.from('obra_visitas').update(op.patch).eq('id',op.vid);q=e?q.eq('updated_at',e):q.eq('status','em_andamento');const {data,error}=await q.select('id,updated_at');if(error)throw error;return data?.[0]||null;};
          let r=await tentar([op.expect,srvUpd[op.vid]].filter(Boolean).sort().pop()||null); // o mais recente dos dois
          if(!r){
            const {data:atual,error}=await sb.from('obra_visitas').select('id,data,status,engenheiro,device_id,updated_at').eq('id',op.vid).maybeSingle();if(error)throw error;
            if(!atual)throw new Error('vistoria ainda não existe no servidor');
            // foi este mesmo aparelho que gravou por último (ex.: recarregou a página): não é conflito
            if(atual.device_id===deviceId&&atual.status==='em_andamento')r=await tentar(atual.updated_at);
            if(!r){conflitoVisita(op,atual);await idb.del(op.id);continue;}
          }
          registrarUpd(op.vid,r.updated_at,op.patch);
        }
        else if(op.kind==='registro'){
          const temMidia=(op.blobs||[]).length>0||!!op.audio;
          const base={...op.row,fotos:(op.row.fotos||[]).filter(f=>!String(f).startsWith('blob:'))};
          if(temMidia)delete base.fotos; // fotos entram no passo 2 (mescladas com o servidor)
          const {error:e1}=await sb.from('obra_registros').upsert(base,{onConflict:'id'});if(e1)throw e1;
          if(temMidia){
            const paths=await uploadBlobs(op,op.row.visita_id);
            let audio_path=null;try{audio_path=await uploadAudio(op,op.row.visita_id);}catch(e){await removerStorage(paths);throw e;}
            const {data:atual}=await sb.from('obra_registros').select('fotos').eq('id',op.row.id).maybeSingle();
            const fotos=[...new Set([...(atual?.fotos||[]),...(op.row.fotos||[]).filter(f=>!String(f).startsWith('blob:')),...paths])];
            const upd={fotos};if(audio_path)upd.audio_path=audio_path;
            const {error:e2}=await sb.from('obra_registros').update(upd).eq('id',op.row.id);
            if(e2){await removerStorage([...paths,...(audio_path?[audio_path]:[])]);throw e2;}
            const loc=visita?.registros?.find(x=>x.id===op.row.id);if(loc){loc.fotos=fotos;if(audio_path)loc.audio_path=audio_path;saveVisita();}
            if(audio_path)transcreverRegistro(op.row.id);
          }
        }
        else if(op.kind==='registro_update'){const {error}=await sb.from('obra_registros').update(op.patch).eq('id',op.id);if(error)throw error;}
        else if(op.kind==='registro_delete'){const {error}=await sb.from('obra_registros').delete().eq('id',op.rid);if(error)throw error;}
        else if(op.kind==='registro_edit'){
          const {error:e1}=await sb.from('obra_registros').update(op.patch).eq('id',op.id);if(e1)throw e1;
          if((op.blobs||[]).length||op.audio){
            const paths=await uploadBlobs(op,op.visita_id);
            let audio_path=null;try{audio_path=await uploadAudio(op,op.visita_id);}catch(e){await removerStorage(paths);throw e;}
            const fotos=[...(op.patch.fotos||[]),...paths];const upd={fotos};if(audio_path)upd.audio_path=audio_path;
            const {error:e2}=await sb.from('obra_registros').update(upd).eq('id',op.id);
            if(e2){await removerStorage([...paths,...(audio_path?[audio_path]:[])]);throw e2;}
            const loc=visita?.registros?.find(x=>x.id===op.id);
            if(loc){loc.fotos=fotos;if(audio_path)loc.audio_path=audio_path;saveVisita();}
            if(audio_path)transcreverRegistro(op.id,true);
          }
        }
        else if(op.kind==='visita_delete'){const {error}=await sb.from('obra_visitas').delete().eq('id',op.visita_id).eq('status','em_andamento');if(error)throw error;}
        else if(op.kind==='registros_delete_tipos'){const {error}=await sb.from('obra_registros').delete().eq('visita_id',op.visita_id).in('tipo',op.tipos);if(error)throw error;}
        await idb.del(op.id);
      }catch(e){
        // Erros permanentes (ex.: vistoria já excluída → violação de FK) nunca vão passar: descarta o item
        if(op.kind!=='visita'&&op.kind!=='visita_patch'&&ERROS_PERMANENTES.has(String(e?.code||''))){console.warn('sync: item descartado (erro permanente):',e,op);await idb.del(op.id);ultimoErroSync=null;continue;}
        ultimoErroSync=e?.message||String(e);console.warn('sync falhou, mantém na fila:',e,op);
        if(vid)bloqueadas.add(vid);
      }
    }
  }catch(e){console.warn('sync:',e);}
}
const transcrevendo=new Set();
async function transcreverRegistro(id,forcar){
  if(transcrevendo.has(id))return;transcrevendo.add(id);
  const loc=visita?.registros?.find(x=>x.id===id);if(loc){loc._transcrevendo=true;}
  rerender();
  try{
    const {data,error}=await sb.functions.invoke('obra-transcrever',{body:{registro_id:id,forcar:!!forcar}});
    const err=error?((await error.context?.json?.().catch(()=>null))?.error||error.message):data?.error;
    if(err)throw new Error(err);
    const tx=data?.transcricao||'';
    if(loc){loc.transcricao=tx;loc.erro_transcricao=null;if(!(loc.descricao||'').trim())loc.descricao=tx;saveVisita();}
    for(const k in cacheRegs){const r=(cacheRegs[k]||[]).find(x=>x.id===id);if(r){r.transcricao=tx;r.erro_transcricao=null;if(!(r.descricao||'').trim())r.descricao=tx;}}
    toast('Áudio transcrito ✓');
  }catch(e){
    console.warn('transcrição:',e);if(loc){loc.erro_transcricao=e?.message||String(e);saveVisita();}
    if(forcar)toast('Falha na transcrição: '+(e?.message||e));
  }finally{transcrevendo.delete(id);if(loc)delete loc._transcrevendo;rerender();}
}
function rerender(){try{if(view==='visita'||String(view).startsWith('detalhe:'))render();}catch{}}
function txHtml(r,cls){
  if(r.transcricao&&r.transcricao!==r.descricao)return `<p class="${cls||'tx'}">🎙️ ${esc(r.transcricao)}</p>`;
  if(r.transcricao)return '<small>🎙️ transcrito do áudio</small> ';
  if(!r.audio_path)return '';
  if(r.audio_path==='local')return '<small>🎙️ áudio aguardando envio</small> ';
  if(r._transcrevendo||transcrevendo.has(r.id))return '<small>🎙️ transcrevendo…</small> ';
  return `<small>🎙️ áudio ${r.erro_transcricao?'· falha na transcrição':'sem transcrição'}</small> <button class="btn sm sec" style="padding:2px 8px;font-size:11px" onclick="event.stopPropagation();transcreverRegistro('${r.id}',true)">transcrever</button> `;
}

function descreverOp(op){
  if(op.kind==='visita')return `Vistoria ${fmtBR(op.row?.data)} (${op.row?.status==='concluida'?'encerrar':'dados'})`;
  if(op.kind==='visita_patch')return `Vistoria ${fmtBR(op.data)} (${op.patch?.status==='concluida'?'encerrar':op.rascunho?'rascunho':'dados'}: ${Object.keys(op.patch||{}).join(', ')})`;
  if(op.kind==='registro_delete')return 'Remoção de item do checklist/serviço';
  if(op.kind==='registro')return `${(op.row?.tipo||'registro').toUpperCase()}${op.rascunho?' (rascunho)':''} · ${op.row?.item||op.row?.descricao?.slice(0,40)||''}${op.blobs?.length?` · ${op.blobs.length} foto(s)`:''}`;
  if(op.kind==='registro_update')return 'Atualização de registro';
  if(op.kind==='visita_delete')return 'Descarte de vistoria';
  if(op.kind==='registro_edit')return `Edição · ${op.patch?.item||(op.patch?.descricao||'').slice(0,40)}${op.blobs?.length?` · ${op.blobs.length} foto(s)`:''}`;

  return op.kind;
}

// ── Autosave (item 2 da checagem 20/10): a cada mudança, enfileira (com debounce) só o que mudou na linha da
// vistoria e os itens de checklist/serviço tocados, como registros com id estável (rids). Perder o celular não perde a vistoria.
let rascT=null;const rascKeys=new Set();
function marcarRascunho(k){if(visita&&!visita.reaberta)rascKeys.add(k);agendarRascunho();}
function agendarRascunho(){if(!visita||visita.status!=='em_andamento'||visita._conflito)return;clearTimeout(rascT);rascT=setTimeout(()=>{flushRascunho().catch(e=>console.warn('rascunho:',e));},1500);}
// linha obra_registros de um item ('checklist|<k>' ou 'servico|<fachada>|<serviço>'); null se o item foi desmarcado
function registroDe(key){
  const [tipo,...rest]=key.split('|');const k=rest.join('|');
  visita.rids=visita.rids||{};const id=visita.rids[key]||(visita.rids[key]=uuid());
  if(tipo==='checklist'){const c=visita.checklist[k];if(!c||!c.status)return null;const label=CHECKLIST.flatMap(g=>g.itens).find(i=>i[0]===k)?.[1]||k;
    return {id,visita_id:visita.id,obra_id:OBRA_ID,tipo:'checklist',item:label,status:c.status,descricao:c.obs||null,user_id:user.id,created_at:new Date().toISOString()};}
  const v=visita.servicos[k];if(!v||!v.status)return null;const [f,s]=k.split('|');
  return {id,visita_id:visita.id,obra_id:OBRA_ID,tipo:'servico',fachada:f,item:s,status:v.status,percentual:v.pct??null,user_id:user.id,created_at:new Date().toISOString()};
}
// Junta (e tira da fila) os rascunhos pendentes da linha desta vistoria, para o próximo patch não perder campos
async function patchPendente(ops,vid){let patch={},expect=null;for(const o of ops){if(o.kind==='visita_patch'&&o.rascunho&&o.vid===vid){patch={...patch,...o.patch};expect=expect||o.expect;await idb.del(o.id);}}return {patch,expect};}
async function flushRascunho(){
  rascT=null;const v=visita;if(!v||v.status!=='em_andamento'||v._conflito||!idb.db)return;
  const ops=await idb.all();let n=0;
  const row=rowVisita();const novo=diffRow(row,v._sent);
  if(Object.keys(novo).length){
    const {patch,expect}=await patchPendente(ops,v.id);
    await idb.add({kind:'visita_patch',vid:v.id,data:row.data,patch:{...patch,...novo},expect:expect||v._srv_updated_at||null,rascunho:true,ts:Date.now()});
    v._sent=cloneRow({...(v._sent||{}),...row});n++;
  }
  for(const key of [...rascKeys]){
    rascKeys.delete(key);const r=registroDe(key);const rid=v.rids[key];
    for(const o of ops)if(o.rascunho&&o.rid===rid)await idb.del(o.id);
    if(r)await idb.add({kind:'registro',row:r,rid,rascunho:true,ts:Date.now()});
    else await idb.add({kind:'registro_delete',rid,vid:v.id,rascunho:true,ts:Date.now()});
    n++;
  }
  localStorage.setItem('obra_visita_ativa',JSON.stringify(v));
  if(n){atualizarSync();sincronizar();}
}

// Registra na vistoria atual o status de uma pendência anterior (vira registro 'observacao' marcado como acompanhamento); "Resolvida" baixa a origem
async function marcarAcomp(origId,st){
  if(!visita)return;const p=(pendencias||[]).find(x=>x.id===origId);if(!p)return;
  visita.acomp=visita.acomp||{};const a=visita.acomp[origId]||{rid:uuid()};const antes=a.st;a.st=st;visita.acomp[origId]=a;
  const loc=visita.registros.find(x=>x.id===a.rid);const meta={acomp:1,...(loc?acompMeta(loc):{}),ref:p.id,data:p.obra_visitas?.data||String(p.created_at||'').slice(0,10),tipo:ehNcReg(p)?'nc':'acompanhar'};
  const row={id:a.rid,visita_id:visita.id,obra_id:OBRA_ID,tipo:'observacao',fachada:p.fachada||null,pavimento:p.pavimento||null,item:p.item||TIPOS[p.tipo]||null,status:ACOMP_ST[st],descricao:JSON.stringify(meta),fotos:(loc?.fotos||[]).filter(f=>!String(f).startsWith('blob:')),user_id:user.id,created_at:loc?.created_at||new Date().toISOString()};
  if(loc)Object.assign(loc,row,{fotos:loc.fotos});else visita.registros.push({...row});
  saveVisita();
  await idb.add({kind:'registro',row,rid:row.id,ts:Date.now()});
  // origem: resolvida baixa (NC → nc_resolvida; reconferir → tira a marca); desfazer reverte
  if(st==='resolvida'&&antes!=='resolvida')await baixarPendencia(p,true);
  else if(antes==='resolvida'&&st!=='resolvida')await baixarPendencia(p,false);
  atualizarSync();sincronizar();toast(`Pendência: ${ACOMP_TXT[st]}`);render();
}
async function baixarPendencia(p,baixa){

  if(ehNcReg(p)&&p.item){try{const {data:irm}=await sb.from('obra_registros').select('id').eq('visita_id',p.visita_id).eq('item',p.item).or('tipo.eq.nc,status.eq.nc').neq('id',p.id);

}

async function encerrarVisita(){
  if(!confirm('Encerrar esta vistoria? Os dados serão enviados ao histórico.')) return;
  clearTimeout(rascT);rascT=null;rascKeys.clear();
  visita.hora_fim=visita.hora_fim||agora();visita.status='concluida';
  const ops=await idb.all();
  // rascunhos pendentes de checklist/serviço desta vistoria saem da fila: a versão final abaixo os substitui (mesmos ids)
  for(const o of ops)if(o.rascunho&&(o.kind==='registro'||o.kind==='registro_delete')&&vidDe(o)===visita.id)await idb.del(o.id);
  // vistoria reaberta: apaga checklist/serviços antigos antes de regravar
  if(visita.reaberta) await idb.add({kind:'registros_delete_tipos',visita_id:visita.id,tipos:['checklist','servico'],ts:Date.now()});
  // checklist + serviços viram registros (id estável por item: regravar não duplica)
  for(const key of [...Object.keys(visita.checklist).map(k=>'checklist|'+k),...Object.keys(visita.servicos).map(k=>'servico|'+k)]){
    const row=registroDe(key);if(row)await idb.add({kind:'registro',row,rid:row.id,ts:Date.now()});
  }
  // snapshot do avanço medido no mapa 3D nesta data (histórico por vistoria)
  try{const m=await carregarMedicao(true);if(m&&m.marcado){const porF={};Object.entries(m.fach).forEach(([f,o])=>porF[f]={pct:Math.round(o.pct*10)/10,feitos:o.feitos,quadros:o.quadros,area:Math.round(o.area),feita:Math.round(o.feita),et:o.et.map(v=>Math.round(v*10)/10)});
    await idb.add({kind:'registro',row:{id:uuid(),visita_id:visita.id,obra_id:OBRA_ID,tipo:'mapa',item:'Avanço medido (mapa 3D)',percentual:Math.round(m.geral),descricao:JSON.stringify({geral:Math.round(m.geral*10)/10,et:m.et.map(v=>Math.round(v*10)/10),fach:porF,pulados:m.pulados,atualizado:m.atualizado}),user_id:user.id,created_at:new Date().toISOString()},ts:Date.now()});}}catch(e){}
  // linha da vistoria: só o que mudou, condicionado ao updated_at conhecido (se outro aparelho gravou, avisa e não sobrescreve)
  {const row=rowVisita();const {patch,expect}=await patchPendente(ops,visita.id);
  await idb.add({kind:'visita_patch',vid:visita.id,data:row.data,patch:{...patch,...diffRow(row,visita._sent),presentes:row.presentes||[],efetivo:row.efetivo||{}},expect:expect||visita._srv_updated_at||null,ts:Date.now()});}
  visita=null;saveVisita();
  toast('Vistoria encerrada');atualizarSync();await sincronizar();go('home');
}
async function descartarVisita(){
  clearTimeout(rascT);rascT=null;rascKeys.clear();
  if(visita._conflito){if(!confirm('Abandonar esta cópia local? O servidor mantém a versão gravada pelo outro aparelho.'))return;
    for(const o of await idb.all())if(vidDe(o)===visita.id)await idb.del(o.id);
    visita=null;saveVisita();go('home');atualizarSync();return;}
  if(visita.reaberta){if(!confirm('Cancelar a reabertura? A vistoria volta ao estado em que estava antes de ser reaberta.'))return;
    const ops=await idb.all();const {patch,expect}=await patchPendente(ops,visita.id);
    if(visita._orig){const volta={...patch,...diffRow(visita._orig,rowVisita())};await enfileirar({kind:'visita_patch',vid:visita.id,data:visita._orig.data,patch:volta,expect:expect||visita._srv_updated_at||null});}}
  else{if(!confirm('Descartar esta vistoria? Ela é removida do histórico; fotos e registros já enviados dela também são apagados.'))return;
    await enfileirar({kind:'visita_delete',visita_id:visita.id});}
  visita=null;saveVisita();go('home');sincronizar();}

// Exclui registro da vistoria em andamento: some da lista local, do banco e do storage (fotos/áudio)
async function excluirRegistroAtivo(id){
  const r=visita?.registros.find(x=>x.id===id);if(!r)return;
  if(!confirm('Excluir este registro'+((r.fotos||[]).length?' e suas fotos':'')+'? Não dá para desfazer.'))return;
  if(navigator.onLine!==false){try{
    const {data:d}=await sb.from('obra_registros').select('fotos,audio_path').eq('id',id).maybeSingle();
    const paths=[...(d?.fotos||[]),...(d?.audio_path?[d.audio_path]:[])].filter(f=>!String(f).startsWith('blob:'));
    const {error}=await sb.from('obra_registros').delete().eq('id',id);if(error)throw error;
    await removerStorage(paths); // só depois da linha: se a linha ficar, as fotos ficam com ela
  }catch(e){toast('Erro ao excluir no servidor: '+(e.message||e));return;}}
  else{toast('Excluir exige conexão');return;}
  visita.registros=visita.registros.filter(x=>x.id!==id);
  if(ehAcomp(r)){for(const [k,a] of Object.entries(visita.acomp||{}))if(a.rid===id){if(a.st==='resolvida'){const p=(pendencias||[]).find(x=>x.id===k);if(p)await baixarPendencia(p,false);}delete visita.acomp[k];}}
  if(r.tipo==='nc'&&r.item){const k=CHECKLIST.flatMap(g=>g.itens).find(([,l])=>l===r.item)?.[0];if(k&&visita.checklist[k]?.status==='nc'&&!visita.registros.some(x=>x.tipo==='nc'&&x.item===r.item)){delete visita.checklist[k];marcarRascunho('checklist|'+k);}}
  reg=null;saveVisita();fecharModal();toast('Registro excluído');render();
}

function mkZoomAt(nz,mx,my){nz=Math.min(8,Math.max(1,nz));const c=$('mkCv');const r=c.getBoundingClientRect();const cx=r.left+r.width/2-mk.tx,cy=r.top+r.height/2-mk.ty;const dx=(mx-cx-mk.tx)/mk.z,dy=(my-cy-mk.ty)/mk.z;mk.z=nz;mk.tx=mx-cx-nz*dx;mk.ty=my-cy-nz*dy;if(nz===1){mk.tx=0;mk.ty=0;}mkApply();}
function mkZoomBtn(d){const a=$('mkCv').parentElement.getBoundingClientRect();const mx=a.left+a.width/2,my=a.top+a.height/2;if(d===0)mkZoomAt(1,mx,my);else mkZoomAt(mk.z*(d>0?1.5:1/1.5),mx,my);}
function mkLw(){return Math.max(3,Math.round(Math.min(mk.img.width,mk.img.height)/150));} // traço proporcional à imagem
function mkPos(e){const c=$('mkCv'),r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};}
function mkDraw(ctx,s){
  ctx.strokeStyle=s.cor;ctx.fillStyle=s.cor;ctx.lineWidth=mkLw();ctx.lineCap='round';ctx.lineJoin='round';
  const w=s.x2-s.x1,h=s.y2-s.y1;
  if(s.t==='ret')ctx.strokeRect(s.x1,s.y1,w,h);
  else if(s.t==='elipse'){ctx.beginPath();ctx.ellipse(s.x1+w/2,s.y1+h/2,Math.abs(w)/2,Math.abs(h)/2,0,0,Math.PI*2);ctx.stroke();}
  else if(s.t==='seta'){const a=Math.atan2(h,w),L=mkLw()*4.5;ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s.x2,s.y2);ctx.lineTo(s.x2-L*Math.cos(a-Math.PI/6),s.y2-L*Math.sin(a-Math.PI/6));ctx.lineTo(s.x2-L*Math.cos(a+Math.PI/6),s.y2-L*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();}
  else if(s.t==='texto'){const fs=mkLw()*7;ctx.font=`bold ${fs}px system-ui,sans-serif`;ctx.textBaseline='middle';ctx.lineWidth=Math.max(2,fs/7);ctx.strokeStyle='#000';ctx.strokeText(s.txt,s.x1,s.y1);ctx.fillText(s.txt,s.x1,s.y1);}
}
function mkRender(){if(!mk.img)return;const c=$('mkCv'),ctx=c.getContext('2d');ctx.drawImage(mk.img,0,0);for(const s of mk.shapes)mkDraw(ctx,s);if(mk.cur)mkDraw(ctx,mk.cur);}

function mkLimpar(){mk.shapes=[];mkRender();}
function mkSetTool(t){mk.tool=t;document.querySelectorAll('.mk-t').forEach(b=>b.classList.toggle('on',b.dataset.t===t));}
function mkSetCor(c){mk.cor=c;document.querySelectorAll('.mk-c').forEach(b=>b.classList.toggle('on',b.dataset.c===c));}
// Abre a tela de marcação para um Blob de imagem. Devolve {m:marcada,o:original} ou null (Pular / sem marcação).
async function marcarFoto(blob){
  if(mk.resolve)mkFechar(false);
  const img=await createImageBitmap(blob,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(blob)).catch(()=>null);
  if(!img)return null;
  mk.img=img;mk.shapes=[];mk.cur=null;mk.base=blob;mk.z=1;mk.tx=0;mk.ty=0;mkApply();
  const c=$('mkCv');c.width=img.width;c.height=img.height;mkRender();
  $('mk').classList.add('show');document.body.classList.add('mk-on');
  return new Promise(res=>{mk.resolve=res;});
}
async function mkFechar(salvar){
  const res=mk.resolve;mk.resolve=null;
  let out=null;
  if(salvar&&mk.shapes.length&&mk.img){mk.cur=null;mkRender();const m=await new Promise(r=>$('mkCv').toBlob(b=>r(b),'image/jpeg',.82));if(m)out={m,o:mk.base};}
  $('mk').classList.remove('show');document.body.classList.remove('mk-on');
  if(mk.img&&mk.img.close)mk.img.close();mk.img=null;mk.base=null;mk.shapes=[];
  if(res)res(out);
}
(function(){
  const c=$('mkCv'),area=c.parentElement;const pts=new Map();let draw=null,pinch=null;
  const cancelDraw=()=>{draw=null;mk.cur=null;mkRender();};
  const pinchStart=()=>{const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,z:mk.z,tx:mk.tx,ty:mk.ty};};
  area.addEventListener('pointerdown',e=>{if(!mk.img)return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{area.setPointerCapture(e.pointerId);}catch(_){}
    if(pts.size===2){cancelDraw();pinchStart();return;}
    if(pts.size>2)return;
    if(e.target!==c)return;const p=mkPos(e);
    if(mk.tool==='texto'){const txt=(prompt('Texto curto:')||'').trim();if(txt)mk.shapes.push({t:'texto',cor:mk.cor,x1:p.x,y1:p.y,txt});mkRender();return;}
    draw={id:e.pointerId};mk.cur={t:mk.tool,cor:mk.cor,x1:p.x,y1:p.y,x2:p.x,y2:p.y};});
  area.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      mk.tx=pinch.tx+(mx-pinch.mx);mk.ty=pinch.ty+(my-pinch.my);mk.z=pinch.z;mkApply();mkZoomAt(pinch.z*(d/(pinch.d||1)),mx,my);return;}
    if(draw&&draw.id===e.pointerId&&mk.cur){const p=mkPos(e);mk.cur.x2=p.x;mk.cur.y2=p.y;mkRender();}});
  const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pinch){if(pts.size<2)pinch=null;return;}
    if(draw&&draw.id===e.pointerId){draw=null;const s=mk.cur;mk.cur=null;if(s&&Math.hypot(s.x2-s.x1,s.y2-s.y1)>mkLw()*2)mk.shapes.push(s);mkRender();}};
  area.addEventListener('pointerup',up);area.addEventListener('pointercancel',up);

  area.addEventListener('wheel',e=>{if(!mk.img)return;e.preventDefault();mkZoomAt(mk.z*(e.deltaY<0?1.15:1/1.15),e.clientX,e.clientY);},{passive:false});
  // celular: a página não rola nem dá zoom; a pinça é tratada acima, dentro da foto
  $('mk').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  $('mk').addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
  document.querySelectorAll('.mk-t').forEach(b=>b.onclick=()=>mkSetTool(b.dataset.t));
  document.querySelectorAll('.mk-c').forEach(b=>b.onclick=()=>mkSetCor(b.dataset.c));
})();

async function reabrirVisita(id){

async function excluirVisita(id){

// Um item do checklist marcado NC gera 2 linhas (registro 'nc' + 'checklist' status nc). Para contar/listar, fica uma por vistoria+item (preferindo o registro com fotos).

  if(acs.length){const stCls={resolvida:'st-ok',persiste:'st-nc',nao_verificada:'st-na'};
    h+=`<h2>Acompanhamento de pendências anteriores (${acs.length})</h2>${acs.map(r=>{const m=acompMeta(r);return `<div class="reg ${acompSt(r)==='persiste'?'nc':''}"><b>${esc(r.item||'')}</b> <small style="color:#64748b">${m.tipo==='nc'?'não conformidade':'item a reconferir'} da vistoria de ${fmtBR(m.data||'')}</small><br>
      <span class="${stCls[acompSt(r)]||''}">Situação em ${fmtBR(v.data)}: <b>${esc(ACOMP_TXT[acompSt(r)]||'')}</b></span>${r.fachada||r.pavimento?` <span class="st-na">· Local: ${esc([r.fachada,r.pavimento].filter(Boolean).join(' · '))}</span>`:''}${m.obs?`<div style="white-space:pre-wrap;margin-top:3px">${esc(m.obs)}</div>`:''}
      ${(r.fotos||[]).length?`<div class="fotos">${r.fotos.map(p=>`<img src="${src(p)}" crossorigin="anonymous">`).join('')}</div>`:''}</div>`;}).join('')}`;}
  if(demais.length) h+=`<h2>Registros</h2>${demais.map(regH).join('')}`;
  if(v.resumo) h+=`<h2>Observações gerais</h2><div style="white-space:pre-wrap">${esc(v.resumo)}</div>`;
  return h+relRodape();
}
const plural=(f,n)=>{if(+n<2)return f;const w=f.split(' ');const a=w[0],l=a.toLowerCase();w[0]=l.endsWith('r')||l.endsWith('s')?a+'es':l.endsWith('ão')?a.slice(0,-2)+'ões':a+'s';return w.join(' ');};
// Efetivo por extenso: "Pintor (1): Fulano; Ajudantes de pintor (2): Beltrano, Ciclano; total 3 · líder: ..."
// Efetivo em duas linhas: documentados (por função, quantidade e nomes) e, se houver, "Efetivo irregular" (não cadastrados). semRotulo: no relatório o rótulo já está na célula.
function textoEfetivo(v,html,semRotulo){
  const E=html?esc:(x=>x);const pres=v.presentes||[];const enc=v.encarregado||'';
  const irreg=pres.filter(ehAvulso);const docs=pres.filter(p=>!ehAvulso(p));
  const ef=Object.entries(v.efetivo||{}).filter(([,n])=>+n>0).sort((a,b)=>ordemFuncao(a[0])-ordemFuncao(b[0]));
  const daFuncao=(p,f)=>ehEncarregado(f)?(p.nome===enc||ehEncarregado(p.funcao)):(p.funcao===f&&p.nome!==enc);
  const partes=[];let totDoc=0;
  for(const [f,n] of ef){const nAv=irreg.filter(p=>daFuncao(p,f)).length;const nd=Math.max(0,+n-nAv);if(!nd)continue;totDoc+=nd;
    const ns=docs.filter(p=>daFuncao(p,f)).map(p=>E(p.nome));partes.push(`${E(plural(f,nd))} (${nd})${ns.length?': '+ns.join(', '):''}`);}
  const extra=(enc&&!pres.some(p=>p.nome===enc)?' · encarregado: '+E(enc):'')+(v.lider?' · líder: '+E(v.lider):'');
  const rot=t=>html?(semRotulo&&t==='Efetivo'?'':`<b>${t}:</b> `):`${t}: `;
  const rotIrr=html?`<b style="color:#b45309">Efetivo irregular:</b> `:'Efetivo irregular: ';
  let l1=rot('Efetivo')+(partes.length?partes.join('; ')+(irreg.length?`; ${totDoc} documentado${totDoc===1?'':'s'}`:`; total ${totDoc}`):'não informado')+extra;
  if(!irreg.length)return l1;
  const l2=rotIrr+irreg.map(p=>`${E(p.nome)} (${E(p.funcao||'função não informada')})`).join(', ')+`; ${irreg.length} irregular${irreg.length===1?'':'es'}`;
  const tot=html?`<br><b>Total:</b> ${totDoc+irreg.length} (${totDoc} documentado${totDoc===1?'':'s'}, ${irreg.length} irregular${irreg.length===1?'':'es'})`:`\nTotal: ${totDoc+irreg.length} (${totDoc} documentados, ${irreg.length} irregulares)`;
  return l1+(html?'<br>':'\n')+l2+tot;
}
function nomeRelatorio(v){return `Relatorio_Vistoria_Menotti_${(v.data||'').replace(/-/g,'')}.pdf`;}
async function imprimirRelatorio(id){
  const w=window.open('','_blank');if(!w){toast('Libere pop-ups para imprimir');return;}
  w.document.write('<p style="font-family:sans-serif">Montando relatório…</p>');
  const d=await dadosRelatorio(id);if(!d){w.close();toast('Vistoria não encontrada');return;}
  w.document.open();
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(nomeRelatorio(d.v).replace('.pdf',''))}</title><style>${REL_CSS}</style></head><body>${relatorioCorpo(d.v,d.rs)}</body></html>`);
  w.document.close();
  const imgs=[...w.document.images];
  await Promise.all(imgs.map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
  w.focus();w.print();
}
function carregarScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return;}const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function compartilharRelatorio(id){
  toast('Gerando PDF…');
  try{
    await carregarScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js');
    const d=await dadosRelatorio(id);if(!d){toast('Vistoria não encontrada');return;}
    const box=document.createElement('div');
    box.style.cssText='position:fixed;left:-10000px;top:0;width:760px;background:#fff';
    box.innerHTML=`<style>${REL_CSS.replace(/@page\{[^}]*\}/,'').replace(/body\{/,'.relpdf{')}</style><div class="relpdf">${relatorioCorpo(d.v,d.rs)}</div>`;
    document.body.appendChild(box);
    await Promise.all([...box.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
    const nome=nomeRelatorio(d.v);
    const blob=await html2pdf().set({margin:[10,10,12,10],filename:nome,image:{type:'jpeg',quality:.9},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','legacy'],avoid:['tr','.reg','.rel-hd']}}).from(box.querySelector('.relpdf')).outputPdf('blob');
    box.remove();
    const file=new File([blob],nome,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:nome.replace('.pdf',''),text:`Relatório de vistoria — ${obra.nome} — ${fmtBR(d.v.data)}`});}catch(e){if(e.name!=='AbortError')throw e;}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();
      toast('PDF baixado');
    }
  }catch(e){console.warn(e);toast('Não foi possível gerar o PDF');}
}
