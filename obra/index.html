<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--gray);color:var(--text);font-size:15px}
body{overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--white);position:relative}
#header{height:var(--header-h);min-height:var(--header-h);background:var(--teal);color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;padding-top:env(safe-area-inset-top)}
#header .back{background:none;border:0;color:#fff;font-size:22px;width:34px;height:34px;border-radius:50%;display:none;align-items:center;justify-content:center}
#header .back.show{display:flex}
#header .ttl{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#header .sub{font-size:11px;opacity:.8;font-weight:400;display:block}
#sync{font-size:11px;padding:4px 8px;border-radius:12px;background:rgba(255,255,255,.15);white-space:nowrap}
#sync.pend{background:var(--amber)}
#sync.off{background:var(--red-md)}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--nav-h) + 20px)}
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--gray2);display:flex}
#nav button{flex:1;border:0;background:none;font-size:11px;color:var(--gray4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600}
#nav button .ic{font-size:22px}
#nav button.on{color:var(--teal)}
.card{background:#fff;border:1px solid var(--gray2);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:14px;color:var(--teal);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.obra-hd{background:linear-gradient(135deg,var(--teal-dk),var(--teal));color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.obra-hd b{font-size:16px;display:block;margin-bottom:4px}
.obra-hd small{opacity:.85;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--gray);border-radius:var(--r-sm);padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--teal)}
.stat small{font-size:11px;color:var(--text2)}
.stat.nc b{color:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:0;border-radius:var(--r-sm);font-size:15px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff}
.btn.sec{background:var(--gray);color:var(--teal)}
.btn.lime{background:var(--lime);color:#fff}
.btn.red{background:var(--red-md);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1}
label.f{display:block;font-size:12px;color:var(--text2);font-weight:600;margin:10px 0 4px}
input.f,select.f,textarea.f{width:100%;padding:11px;border:1.5px solid var(--gray2);border-radius:var(--r-sm);font-size:15px;background:#fff;color:var(--text);font-family:inherit}
textarea.f{min-height:76px;resize:vertical}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{border:1.5px solid var(--gray2);background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.ck{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--gray2)}
.ck:last-child{border-bottom:0}
.ck .lb{flex:1;font-size:14px;line-height:1.3}
.ck .lb small{display:block;color:var(--red);font-size:11px;margin-top:2px}
.seg{display:flex;border:1.5px solid var(--gray2);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:#fff;padding:8px 10px;font-size:12px;font-weight:700;color:var(--gray4);min-width:38px}
.seg button+button{border-left:1.5px solid var(--gray2)}
.seg button.ok{background:var(--green);color:#fff}
.seg button.nc{background:var(--red-md);color:#fff}

.seg button.s2{background:var(--green);color:#fff}
.pct{width:64px;padding:8px 6px;border:1.5px solid var(--gray2);border-radius:8px;font-size:14px;text-align:center}
.fach{margin-bottom:10px}

.fach summary::-webkit-details-marker{display:none}
.fach summary .bar{height:6px;background:#fff;border-radius:3px;width:80px;overflow:hidden}
.fach summary .bar i{display:block;height:100%;background:var(--lime)}
.fach .body{padding:6px 4px 0}
.reg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray2)}
.reg:last-child{border-bottom:0}
.reg .th{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--gray);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}

.reg .bd b{font-size:14px;display:block}
.reg .bd p{font-size:13px;color:var(--text2);margin-top:2px;white-space:pre-wrap}
.reg .bd small{font-size:11px;color:var(--gray4)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--gray);color:var(--text2);margin-right:4px;text-transform:uppercase}

.tag.oc{background:var(--amber-lt);color:var(--amber)}

.fab{position:absolute;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--lime);color:#fff;border:0;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:5}

.chips button.on{background:var(--teal);color:#fff;border-color:var(--teal)}

.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--gray2)}

.rec{display:flex;align-items:center;gap:10px;margin-top:10px}
.rec button{border:0;border-radius:20px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--gray);color:var(--teal)}
.rec button.on{background:var(--red-md);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.vis{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--gray2)}
.vis:last-child{border-bottom:0}
.vis .d{width:48px;text-align:center;background:var(--turq-lt);border-radius:8px;padding:6px 0;color:var(--teal-dk);font-weight:700;font-size:12px;line-height:1.2}
.vis .d b{font-size:18px;display:block}
.vis .i{flex:1;min-width:0}
.vis .i b{font-size:14px;display:block}
.vis .i small{color:var(--text2);font-size:12px}
.vis .ar{color:var(--gray3);font-size:20px}
.empty{text-align:center;color:var(--gray4);padding:30px 10px;font-size:14px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);background:var(--teal-dk);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.lightbox{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:40}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%}
.lightbox button{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);border:0;color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%}
.muted{color:var(--text2);font-size:12px}
body.auth-checking #app>*{visibility:hidden}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#0D3C44,#155B67);color:#fff;display:flex;align-items:center;justify-content:center;z-index:99;font-size:14px;padding:20px;text-align:center}
#gate .bx{background:#fff;color:var(--text);border-radius:16px;padding:28px;max-width:400px}
#gate .bx h2{color:var(--teal);font-size:19px;margin:10px 0}
#gate a{display:inline-block;background:var(--teal);color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:700;margin-top:8px}
</style>

<script>
// ═══════════════ CONFIG ═══════════════
const SUPABASE_URL='https://fimmjgdwhifsrrbreche.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpbW1qZ2R3aGlmc3JyYnJlY2hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NzU2NDIsImV4cCI6MjA5NTE1MTY0Mn0.eAmMS95M8BkfX3NCcOtHnhKWXy0jkvXwSGEoqv_Q21Q';
const BUCKET='obra-fotos';
const OBRA_ID='menotti';
const APP_BUILD='20260916-5';

const CHECKLIST=[
  {g:'Segurança (NR-35 / NR-18)',itens:[

    ['qual_subst','Substrato tratado antes da aplicação'],

    ['qual_junta','Juntas e selantes conforme especificação'],
    ['qual_fiss','Sem fissuras / manchas nos trechos recentes']]}
];
const SERVICOS=['Remoção de pastilhas','Tratamento do substrato / fissuras','Regularização (chapisco / reboco)','Fundo / primer','Revestimento / pintura','Selantes de juntas','Limpeza final'];
const FUNCOES=['Encarregado','Pedreiro','Servente','Alpinista','Pintor','Ajudante'];
const TIPOS={nc:'Não conformidade',ocorrencia:'Ocorrência',foto:'Registro fotográfico',material:'Material recebido',observacao:'Observação'};
const CLIMAS=['Sol','Nublado','Chuva','Chuva forte','Vento forte'];

// ═══════════════ SUPABASE + GATE ═══════════════
let sb=null, user=null, obra=null;
function gate(msg){document.getElementById('gate').innerHTML=`<div class="bx"><img src="../assets/logo-dark.png" alt="Diagnóstika" style="height:54px"><h2>🔒 Acesso restrito</h2><p class="muted" style="font-size:13px;line-height:1.5">${msg}</p><a href="/">🔑 Ir para o login</a></div>`;}
(async()=>{
  const t0=Date.now(); while(!window.supabase&&Date.now()-t0<6000) await new Promise(r=>setTimeout(r,80));
  if(!window.supabase){gate('Não foi possível carregar a biblioteca de acesso. Verifique a conexão.');return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  let session=null;
  for(let i=0;i<3;i++){const {data}=await sb.auth.getSession();if(data?.session){session=data.session;break;}await new Promise(r=>setTimeout(r,250));}
  if(!session){gate('É necessário fazer login no portal de sistemas da Diagnóstika.');return;}
  user=session.user;
  try{const {data:v}=await sb.from('user_condos').select('role').eq('user_id',user.id);if(v&&v.some(x=>x.role==='sindico')){gate('Este aplicativo é exclusivo da equipe técnica da Diagnóstika.');return;}}catch(e){}
  document.getElementById('gate').remove();document.body.classList.remove('auth-checking');
  init();
})();
function nomeUser(){return user?.user_metadata?.nome||(user?.email?user.email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()):'Equipe');}

// ═══════════════ UTIL ═══════════════
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16);});
const hoje=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const agora=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const fmtBR=iso=>{const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:'—';};
const fmtHora=ts=>ts?new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'}):'';
const fotoUrl=p=>`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${p.split('/').map(encodeURIComponent).join('/')}`;
const deviceId=(()=>{let id=localStorage.getItem('device_id');if(!id){id='dev-'+Math.random().toString(36).slice(2,10);localStorage.setItem('device_id',id);}return id;})();
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

async function comprimir(file,max=1600,q=.82){
  const bmp=await createImageBitmap(file).catch(()=>null);
  if(!bmp) return file;
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',q));
}

// ═══════════════ IndexedDB — fila offline ═══════════════
const idb={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('obra-dk',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('ops',{keyPath:'id',autoIncrement:true});};r.onsuccess=e=>{this.db=e.target.result;res();};r.onerror=()=>rej(r.error);});},
  tx(mode){return this.db.transaction('ops',mode).objectStore('ops');},
  add(op){return new Promise((res,rej)=>{const r=this.tx('readwrite').add(op);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  all(){return new Promise((res,rej)=>{const r=this.tx('readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  del(id){return new Promise((res,rej)=>{const r=this.tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});},
  count(){return new Promise((res,rej)=>{const r=this.tx('readonly').count();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
};
let syncing=false;
async function enfileirar(op){await idb.add({...op,ts:Date.now()});atualizarSync();sincronizar();}
async function atualizarSync(){
  const n=await idb.count().catch(()=>0);const el=$('sync');
  if(!navigator.onLine){el.textContent=`⛔ offline · ${n} pend.`;el.className='off';}
  else if(n>0){el.textContent=`⏳ ${n} pendente${n>1?'s':''}`;el.className='pend';}
  else{el.textContent='✓ sincronizado';el.className='';}
}
let syncAgain=false;
// Se já há uma sincronização em curso, espera ela terminar e roda de novo (garante que
// quem chamou "await sincronizar()" só continua com a fila realmente esvaziada).
async function sincronizar(){
  if(!navigator.onLine||!sb) return;
  if(syncing){syncAgain=true;return syncing;}
  syncing=(async()=>{do{syncAgain=false;await sincronizarFila();}while(syncAgain);})().finally(()=>{syncing=null;atualizarSync();});
  return syncing;
}
async function sincronizarFila(){
  try{
    const ops=await idb.all();
    for(const op of ops){
      try{
        if(op.kind==='visita'){const {error}=await sb.from('obra_visitas').upsert(op.row,{onConflict:'id'});if(error)throw error;}
        else if(op.kind==='registro'){
          const paths=[];
          for(const b of (op.blobs||[])){
            const path=`${OBRA_ID}/${op.row.visita_id}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.jpg`;
            const {error}=await sb.storage.from(BUCKET).upload(path,b,{contentType:'image/jpeg',cacheControl:'31536000'});
            if(error)throw error; paths.push(path);
          }
          let audio_path=null;
          if(op.audio){
            audio_path=`${OBRA_ID}/${op.row.visita_id}/audio_${Date.now()}.webm`;
            const {error}=await sb.storage.from(BUCKET).upload(audio_path,op.audio,{contentType:op.audio.type||'audio/webm'});
            if(error)throw error;
          }
          const row={...op.row,fotos:[...(op.row.fotos||[]),...paths],audio_path:audio_path||op.row.audio_path||null};
          const {error}=await sb.from('obra_registros').upsert(row,{onConflict:'id'});if(error)throw error;
        }
        else if(op.kind==='registro_update'){const {error}=await sb.from('obra_registros').update(op.patch).eq('id',op.id);if(error)throw error;}
        else if(op.kind==='registros_delete_tipos'){const {error}=await sb.from('obra_registros').delete().eq('visita_id',op.visita_id).in('tipo',op.tipos);if(error)throw error;}
        await idb.del(op.id);
      }catch(e){console.warn('sync falhou, mantém na fila:',e);break;}
    }
  }catch(e){console.warn('sync:',e);}
}
window.addEventListener('online',()=>{atualizarSync();sincronizar();});
window.addEventListener('offline',atualizarSync);

let view='home', tab='inicio', navStack=[];

function loadVisita(){try{visita=JSON.parse(localStorage.getItem('obra_visita_ativa')||'null');}catch(e){visita=null;}}

// ═══════════════ NAVEGAÇÃO ═══════════════
function go(v,push=false){
  if(push) navStack.push({view,tab}); else navStack=[];

}
function goBack(){const p=navStack.pop();if(p){view=p.view;tab=p.tab;}else view='home';render();}
function setTitle(t,s){$('hTitle').innerHTML=`${esc(t)}<span class="sub">${esc(s||'')}</span>`;}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view.split(':')[0]));

  if(visita.reaberta) await idb.add({kind:'registros_delete_tipos',visita_id:visita.id,tipos:['checklist','servico'],ts:Date.now()});
  // checklist + serviços viram registros
  for(const [k,c] of Object.entries(visita.checklist)){
    const label=CHECKLIST.flatMap(g=>g.itens).find(i=>i[0]===k)?.[1]||k;
    await idb.add({kind:'registro',row:{id:uuid(),visita_id:visita.id,obra_id:OBRA_ID,tipo:'checklist',item:label,status:c.status,descricao:c.obs||null,user_id:user.id,created_at:new Date().toISOString()},ts:Date.now()});
  }
  for(const [k,v] of Object.entries(visita.servicos)){
    if(!v.status) continue;const [f,s]=k.split('|');
    await idb.add({kind:'registro',row:{id:uuid(),visita_id:visita.id,obra_id:OBRA_ID,tipo:'servico',fachada:f,item:s,status:v.status,percentual:v.pct??null,user_id:user.id,created_at:new Date().toISOString()},ts:Date.now()});
  }
  await idb.add({kind:'visita',row:rowVisita(),ts:Date.now()});
  visita=null;saveVisita();
  toast('Vistoria encerrada');atualizarSync();await sincronizar();go('home');

let reg=null, recorder=null, recChunks=[];
function abrirRegistro(pre={}){
  if(!visita){toast('Inicie uma vistoria primeiro');return;}
  reg={tipo:pre.tipo||'foto',fachada:pre.fachada||'',pavimento:'',item:pre.item||'',descricao:'',blobs:[],previews:[],audio:null,ckKey:pre.ckKey||null};
  renderModal();$('modal').classList.add('show');
}
function fecharModal(){pararGravacao(true);$('modal').classList.remove('show');reg=null;}
function renderModal(){
  const r=reg;
  $('sheet').innerHTML=`<h2>${r.ckKey?'Não conformidade no checklist':'Novo registro'}</h2>
  ${r.ckKey?`<p class="muted" style="margin-bottom:8px"><b>${esc(r.item)}</b></p>`:`<div class="chips">${Object.entries(TIPOS).map(([k,l])=>`<button class="${r.tipo===k?'on '+(k==='nc'?'nc':''):''}" onclick="reg.tipo='${k}';renderModal()">${l}</button>`).join('')}</div>`}
  <label class="f">Local</label><div class="chips">${obra.fachadas.map(f=>`<button class="${r.fachada===f?'on':''}" onclick="reg.fachada=reg.fachada==='${esc(f)}'?'':'${esc(f)}';renderModal()">${esc(f.split(' — ')[0])}</button>`).join('')}</div>
  <div class="row"><div><label class="f">Pavimento / trecho</label><input class="f" value="${esc(r.pavimento)}" placeholder="Ex.: 7º pav., prumada 3" onchange="reg.pavimento=this.value"></div></div>
  ${r.ckKey?'':`<label class="f">Título</label><input class="f" value="${esc(r.item)}" placeholder="${r.tipo==='nc'?'Ex.: Cordas sem proteção na quina':r.tipo==='material'?'Ex.: Argamassa ACIII, 40 sacos':'Ex.: Andamento 6º pavimento'}" onchange="reg.item=this.value">`}
  <label class="f">Descrição</label><textarea class="f" placeholder="Descreva o que foi observado…" onchange="reg.descricao=this.value">${esc(r.descricao)}</textarea>
  <div class="rec"><button id="btnRec" class="${recorder?'on':''}" onclick="toggleGravacao()">${recorder?'⏹ Parar':'🎙️ Gravar observação'}</button><span class="muted" id="recInfo">${r.audio?'áudio gravado ✓':''}</span></div>
  <label class="f">Fotos</label><div class="photos">${r.previews.map((p,i)=>`<img src="${p}" onclick="reg.blobs.splice(${i},1);reg.previews.splice(${i},1);renderModal()" title="toque para remover">`).join('')}<button class="add" onclick="$('fileCam').click()">📷</button><button class="add" onclick="$('fileGal').click()">🖼️</button></div>
  <button class="btn ${r.tipo==='nc'?'red':''}" style="margin-top:16px" onclick="salvarRegistro()">Salvar registro</button>
  <button class="btn sec" style="margin-top:8px" onclick="cancelarRegistro()">Cancelar</button>`;
}
function cancelarRegistro(){if(reg?.ckKey){visita.checklist[reg.ckKey]={status:'nc'};saveVisita();}fecharModal();render();}
async function addFotos(files){
  if(!reg) return;
  for(const f of files){const b=await comprimir(f);reg.blobs.push(b);reg.previews.push(URL.createObjectURL(b));}
  renderModal();
}
$('fileCam').addEventListener('change',e=>{addFotos([...e.target.files]);e.target.value='';});
$('fileGal').addEventListener('change',e=>{addFotos([...e.target.files]);e.target.value='';});
async function toggleGravacao(){
  if(recorder){pararGravacao();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>recChunks.push(e.data);
    recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(reg&&recChunks.length){reg.audio=new Blob(recChunks,{type:recorder.mimeType||'audio/webm'});}recorder=null;if(reg)renderModal();};
    recorder.start();renderModal();
  }catch(e){toast('Microfone indisponível');}
}
function pararGravacao(silent){if(recorder&&recorder.state!=='inactive'){if(silent)reg=null;recorder.stop();}}
async function salvarRegistro(){
  const r=reg;if(!r)return;
  if(!r.item&&!r.descricao&&!r.blobs.length&&!r.audio){toast('Adicione título, descrição ou foto');return;}
  const row={id:uuid(),visita_id:visita.id,obra_id:OBRA_ID,tipo:r.tipo,fachada:r.fachada||null,pavimento:r.pavimento||null,item:r.item||null,status:r.tipo==='nc'?'nc':null,descricao:r.descricao||null,fotos:[],user_id:user.id,created_at:new Date().toISOString()};
  if(r.ckKey){visita.checklist[r.ckKey]={status:'nc',obs:r.descricao||r.item};}
  visita.registros.push({...row,fotos:r.previews.slice(),audio_path:r.audio?'local':null});saveVisita();
  await idb.add({kind:'registro',row,blobs:r.blobs,audio:r.audio,ts:Date.now()});
  reg=null;$('modal').classList.remove('show');
  toast('Registro salvo');atualizarSync();sincronizar();
  if(r.ckKey) tab='checklist'; else tab='registros';
  render();
}

// ═══════════════ HISTÓRICO ═══════════════
async function rHistorico(){
  setTitle('Histórico',obra.nome);
  $('view').innerHTML=`<div class="card"><h3>Vistorias</h3><div id="lista"><div class="empty">Carregando…</div></div></div>`;
  await carregarVisitas();if(view!=='historico')return;
  $('lista').innerHTML=cacheVisitas.length?cacheVisitas.map(visItem).join(''):'<div class="empty">Nenhuma vistoria registrada.</div>';
}
async function abrirDetalhe(id){navStack.push({view,tab});view='detalhe:'+id;render();}
async function rDetalhe(){
  const id=view.split(':')[1];const v=cacheVisitas.find(x=>x.id===id);
  if(!v){goBack();return;}
  setTitle(`Vistoria ${fmtBR(v.data)}`,v.engenheiro||'');
  $('view').innerHTML=`<div class="card"><h3>Dados</h3><p style="font-size:14px;line-height:1.6">${v.hora_inicio?esc(v.hora_inicio.slice(0,5)):''}${v.hora_fim?' – '+esc(v.hora_fim.slice(0,5)):''} · ${esc(v.clima||'—')}${v.temperatura?' · '+esc(v.temperatura)+'°C':''}${v.paralisacao?' · <b style="color:var(--red)">obra paralisada</b>':''}<br>
    Efetivo: ${Object.entries(v.efetivo||{}).filter(([,n])=>+n>0).map(([f,n])=>`${n} ${esc(f)}`).join(', ')||'—'}${v.encarregado?' · enc. '+esc(v.encarregado):''}</p>${v.resumo?`<p style="font-size:14px;margin-top:8px;white-space:pre-wrap">${esc(v.resumo)}</p>`:''}</div>
    <div id="detRegs"><div class="empty">Carregando registros…</div></div>`;
  const {data}=await sb.from('obra_registros').select('*').eq('visita_id',id).order('created_at');
  if(view!=='detalhe:'+id)return;
  const rs=data||[];
  const ck=rs.filter(r=>r.tipo==='checklist'),sv=rs.filter(r=>r.tipo==='servico'),outros=rs.filter(r=>!['checklist','servico'].includes(r.tipo));
  let h='';
  if(sv.length){const byF={};sv.forEach(r=>{(byF[r.fachada]=byF[r.fachada]||[]).push(r);});
    h+=`<div class="card"><h3>Serviços por fachada</h3>${Object.entries(byF).map(([f,arr])=>`<b style="font-size:13px;display:block;margin:8px 0 4px">${esc(f)}</b>${arr.map(r=>`<div class="ck"><span class="lb">${esc(r.item)}</span><span class="tag ${r.status==='concluido'?'ok':'oc'}">${r.status==='concluido'?'concluído':'em andamento'} ${r.percentual??0}%</span></div>`).join('')}`).join('')}</div>`;}
  if(ck.length) h+=`<div class="card"><h3>Checklist</h3>${ck.map(r=>`<div class="ck"><span class="lb">${esc(r.item)}${r.descricao?`<small>${esc(r.descricao)}</small>`:''}</span><span class="tag ${r.status==='nc'?'nc':r.status==='ok'?'ok':''}">${r.status==='na'?'N/A':r.status}</span></div>`).join('')}</div>`;
  h+=`<div class="card"><h3>Registros (${outros.length})</h3>${outros.length?outros.map(r=>`<div>${regItem(r)}<div style="text-align:right;margin:-6px 0 6px"><button class="btn sm sec" style="color:var(--red);padding:4px 10px;font-size:12px" onclick="excluirRegistro('${r.id}')">🗑 excluir</button></div></div>`).join(''):'<div class="empty">Sem registros.</div>'}</div>
  <div class="card"><h3>Ações</h3>
    <button class="btn sec" onclick="editarVisita('${esc(v.id)}')">✏️ Editar dados (data, horário, clima, resumo)</button>
    <button class="btn sec" style="margin-top:8px" onclick="reabrirVisita('${esc(v.id)}')">🔓 Reabrir para alterar checklist, fachadas e registros</button>
    <button class="btn sec" style="margin-top:8px;color:var(--red)" onclick="excluirVisita('${esc(v.id)}')">🗑 Excluir vistoria inteira</button>
  </div>`;
  $('detRegs').innerHTML=h;
  cacheRegs[id]=rs;
}
// ── editar / reabrir / excluir ──
function editarVisita(id){
  const v=cacheVisitas.find(x=>x.id===id);if(!v)return;
  const ef=v.efetivo||{};
  $('sheet').innerHTML=`<h2>Editar vistoria</h2>
    <div class="row"><div><label class="f">Data</label><input class="f" type="date" id="ev_data" value="${esc(v.data)}"></div><div><label class="f">Engenheiro</label><input class="f" id="ev_eng" value="${esc(v.engenheiro||'')}"></div></div>
    <div class="row"><div><label class="f">Início</label><input class="f" type="time" id="ev_hi" value="${esc((v.hora_inicio||'').slice(0,5))}"></div><div><label class="f">Saída</label><input class="f" type="time" id="ev_hf" value="${esc((v.hora_fim||'').slice(0,5))}"></div></div>
    <div class="row"><div><label class="f">Clima</label><select class="f" id="ev_clima"><option value="">—</option>${CLIMAS.map(c=>`<option ${v.clima===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="f">Temp. (°C)</label><input class="f" id="ev_temp" inputmode="numeric" value="${esc(v.temperatura||'')}"></div></div>
    <label class="f" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="ev_par" ${v.paralisacao?'checked':''} style="width:20px;height:20px"> Obra paralisada</label>
    <label class="f">Encarregado</label><input class="f" id="ev_enc" value="${esc(v.encarregado||'')}">
    <label class="f">Efetivo</label>${FUNCOES.map(f=>`<div class="ck"><span class="lb">${f}</span><input class="pct" inputmode="numeric" data-ef="${f}" value="${ef[f]??''}" placeholder="0"></div>`).join('')}
    <label class="f">Resumo</label><textarea class="f" id="ev_res">${esc(v.resumo||'')}</textarea>
    <button class="btn" style="margin-top:16px" onclick="salvarEdicaoVisita('${esc(id)}')">Salvar alterações</button>
    <button class="btn sec" style="margin-top:8px" onclick="fecharModal()">Cancelar</button>`;
  $('modal').classList.add('show');
}
async function salvarEdicaoVisita(id){
  const v=cacheVisitas.find(x=>x.id===id);if(!v)return;
  const efetivo={};document.querySelectorAll('#sheet [data-ef]').forEach(i=>{if(+i.value>0)efetivo[i.dataset.ef]=+i.value;});
  Object.assign(v,{data:$('ev_data').value||v.data,engenheiro:$('ev_eng').value,hora_inicio:$('ev_hi').value||null,hora_fim:$('ev_hf').value||null,clima:$('ev_clima').value,temperatura:$('ev_temp').value,paralisacao:$('ev_par').checked,encarregado:$('ev_enc').value,efetivo,resumo:$('ev_res').value});
  const {obra_visitas,...row}=v;
  $('modal').classList.remove('show');
  await enfileirar({kind:'visita',row});
  toast('Vistoria atualizada');render();
}
async function reabrirVisita(id){
  if(visita){toast('Encerre a vistoria em andamento antes de reabrir outra');return;}
  const v=cacheVisitas.find(x=>x.id===id);if(!v)return;
  if(!confirm(`Reabrir a vistoria de ${fmtBR(v.data)}? Ela volta para edição; ao encerrar de novo, o checklist e os serviços são regravados.`))return;
  let rs=cacheRegs[id];
  if(!rs){const {data}=await sb.from('obra_registros').select('*').eq('visita_id',id).order('created_at');rs=data||[];}
  const checklist={},servicos={};
  const byLabel=Object.fromEntries(CHECKLIST.flatMap(g=>g.itens).map(([k,l])=>[l,k]));
  rs.filter(r=>r.tipo==='checklist').forEach(r=>{const k=byLabel[r.item];if(k)checklist[k]={status:r.status,obs:r.descricao||undefined};});
  rs.filter(r=>r.tipo==='servico').forEach(r=>{servicos[r.fachada+'|'+r.item]={status:r.status,pct:r.percentual??undefined};});
  const registros=rs.filter(r=>!['checklist','servico'].includes(r.tipo));
  const {obra_visitas,...row}=v;
  visita={...row,hora_inicio:(row.hora_inicio||'').slice(0,5),hora_fim:null,status:'em_andamento',efetivo:row.efetivo||{},temperatura:row.temperatura||'',clima:row.clima||'',encarregado:row.encarregado||'',resumo:row.resumo||'',checklist,servicos,registros,reaberta:true};
  saveVisita();
  await enfileirar({kind:'visita',row:rowVisita()});
  tab='inicio';go('visita');toast('Vistoria reaberta');
}
async function excluirVisita(id){
  const v=cacheVisitas.find(x=>x.id===id);if(!v)return;
  if(!navigator.onLine){toast('Excluir exige conexão');return;}
  if(!confirm(`Excluir a vistoria de ${fmtBR(v.data)} com TODOS os registros e fotos? Não dá para desfazer.`))return;
  const {data:rs}=await sb.from('obra_registros').select('fotos,audio_path').eq('visita_id',id);
  const paths=(rs||[]).flatMap(r=>[...(r.fotos||[]),...(r.audio_path?[r.audio_path]:[])]);
  if(paths.length) await sb.storage.from(BUCKET).remove(paths);
  const {error}=await sb.from('obra_visitas').delete().eq('id',id);
  if(error){toast('Erro ao excluir: '+error.message);return;}
  cacheVisitas=cacheVisitas.filter(x=>x.id!==id);delete cacheRegs[id];
  toast('Vistoria excluída');navStack=[];go('historico');
}
async function excluirRegistro(rid){
  if(!navigator.onLine){toast('Excluir exige conexão');return;}
  if(!confirm('Excluir este registro (e suas fotos)?'))return;
  const {data:r}=await sb.from('obra_registros').select('fotos,audio_path').eq('id',rid).maybeSingle();
  const paths=[...(r?.fotos||[]),...(r?.audio_path?[r.audio_path]:[])];
  if(paths.length) await sb.storage.from(BUCKET).remove(paths);
  const {error}=await sb.from('obra_registros').delete().eq('id',rid);
  if(error){toast('Erro: '+error.message);return;}
  toast('Registro excluído');render();
}

// ═══════════════ PENDÊNCIAS (NCs abertas) ═══════════════
async function rNcs(){
  setTitle('Pendências','não conformidades abertas');
  $('view').innerHTML=`<div class="card"><h3>NCs abertas</h3><div id="ncl"><div class="empty">Carregando…</div></div></div><div class="card"><h3>Resolvidas recentemente</h3><div id="ncr"></div></div>`;
  const {data}=await sb.from('obra_registros').select('*,obra_visitas(data)').eq('obra_id',OBRA_ID).or('tipo.eq.nc,status.eq.nc').order('created_at',{ascending:false}).limit(200);
  if(view!=='ncs')return;
  const rs=data||[];const ab=rs.filter(r=>!r.nc_resolvida),re=rs.filter(r=>r.nc_resolvida).slice(0,10);
  const item=r=>`<div>${regItem({...r,created_at:r.created_at})}<div style="display:flex;gap:8px;justify-content:flex-end;margin:-4px 0 8px"><small class="muted" style="flex:1;align-self:center">vistoria ${fmtBR(r.obra_visitas?.data)}</small>${r.nc_resolvida?'':`<button class="btn sm lime" onclick="resolverNc('${r.id}')">✓ Resolvida</button>`}</div></div>`;
  $('ncl').innerHTML=ab.length?ab.map(item).join(''):'<div class="empty">Nenhuma pendência aberta. 👍</div>';
  $('ncr').innerHTML=re.length?re.map(item).join(''):'<div class="empty">—</div>';
}
async function resolverNc(id){
  if(!confirm('Marcar esta não conformidade como resolvida?'))return;
  await enfileirar({kind:'registro_update',id,patch:{nc_resolvida:true,nc_resolvida_em:new Date().toISOString()}});
  toast('NC marcada como resolvida');setTimeout(render,600);
}
</script>
